name: One-time Schedule Context Patch

on:
  push:
    branches: [scheduling-v2-engine]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-v2-engine
      - name: Patch schedule context and split controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/schedule/page.tsx')
          s=p.read_text()
          original=s
          s=s.replace("const from=zonedLocalToIso(addDateDays(ws,-1),'00:00:00',s.timezone),to=zonedLocalToIso(addDateDays(ws,8),'00:00:00',s.timezone)","const from=zonedLocalToIso(addDateDays(ws,-14),'00:00:00',s.timezone),to=zonedLocalToIso(addDateDays(ws,15),'00:00:00',s.timezone)")
          s=s.replace("preferred_start:row.preferred_start,preferred_end:row.preferred_end}}","preferred_start:row.preferred_start,preferred_end:row.preferred_end,allow_split_shifts:row.allow_split_shifts!==false,min_split_gap_hours:asNum(row.min_split_gap_hours,.5)}}")
          s=s.replace("preferred_start:null,preferred_end:null}}","preferred_start:null,preferred_end:null,allow_split_shifts:true,min_split_gap_hours:.5}}")
          s=s.replace("preferred_days_off,preferred_start,preferred_end').eq('location_id'","preferred_days_off,preferred_start,preferred_end,allow_split_shifts,min_split_gap_hours').eq('location_id'")
          s=s.replace("preferred_end:p.preferred_end},{onConflict:'employee_id'}","preferred_end:p.preferred_end,allow_split_shifts:p.allow_split_shifts??true,min_split_gap_hours:p.min_split_gap_hours??.5},{onConflict:'employee_id'}")
          marker='<Field label="Hourly rate (manager only)">'
          if 'Minimum split gap hours' not in s and marker in s:
              insert='<label className={styles.field}><span>Allow split shifts</span><input type="checkbox" checked={p.allow_split_shifts!==false} onChange={x=>changeSchedProfile(e.id,\'allow_split_shifts\',x.target.checked)}/></label><Field label="Minimum split gap hours"><input type="number" min="0" max="12" step="0.5" value={p.min_split_gap_hours??.5} onChange={x=>changeSchedProfile(e.id,\'min_split_gap_hours\',asNum(x.target.value,.5))}/></Field>'
              s=s.replace(marker,insert+marker,1)
          if s==original:
              print('already applied')
          else:
              p.write_text(s)
              print('patched schedule context and split controls')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add app/schedule/page.tsx
          git commit -m "Align schedule boundary context and expose split rules [schedule-context-patched]"
          git push origin HEAD:scheduling-v2-engine
