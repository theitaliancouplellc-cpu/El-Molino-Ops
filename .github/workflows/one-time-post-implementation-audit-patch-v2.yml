name: One-time post-implementation audit patch v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run literal-safe audited patch generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/one-time-post-implementation-audit-patch.yml').read_text()
          marker="cat > /tmp/patch.py <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          script=textwrap.dedent(src[start:end])
          script=script.replace("re.subn(pattern,replacement,s,count=count,flags=re.S)","re.subn(pattern,lambda _m: replacement,s,count=count,flags=re.S)")
          Path('/tmp/patch.py').write_text(script)
          PY
          python /tmp/patch.py
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified patches and self-remove
        shell: bash
        run: |
          rm .github/workflows/one-time-post-implementation-audit-patch.yml
          rm .github/workflows/one-time-post-implementation-audit-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch post-implementation restaurant ops failures"
          git push
