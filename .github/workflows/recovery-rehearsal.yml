name: Disaster Recovery Rehearsal

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: disaster-recovery-rehearsal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  portable-backup-contract:
    name: Rehearse portable backup recovery contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Mark recovery rehearsal pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/recovery-status-pending.json
          const runUrl=`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          process.stdout.write(JSON.stringify({
            state:'pending',
            context:'Disaster Recovery Rehearsal',
            description:'Validating portable recovery contract for exact SHA',
            target_url:runUrl,
          }));
          NODE
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/recovery-status-pending.json >/dev/null

      - name: Checkout exact repository SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run backup and restore regression contracts
        id: regression
        run: npx tsx --test tests/backup-manifest-contract.test.ts tests/backup-integrity.test.ts tests/disaster-recovery-contract.test.ts

      - name: Run non-destructive synthetic recovery rehearsal
        id: rehearsal
        env:
          RECOVERY_EVIDENCE_PATH: artifacts/recovery-rehearsal.json
        run: npx tsx scripts/recovery-rehearsal.ts

      - name: Upload sanitized recovery evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-rehearsal-${{ github.sha }}
          path: artifacts/recovery-rehearsal.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish recovery rehearsal summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Disaster Recovery Rehearsal'
            echo
            echo "- Exact SHA: \`${GITHUB_SHA}\`"
            echo '- Scope: synthetic portable-backup contract validation only'
            echo '- Production database access: none'
            echo '- Production writes: none'
            echo '- Storage object bytes: not covered by portable JSON recovery'
            if [ -f artifacts/recovery-rehearsal.json ]; then
              echo
              echo '```json'
              cat artifacts/recovery-rehearsal.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish stable recovery rehearsal commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REHEARSAL_OUTCOME: ${{ steps.rehearsal.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          state='failure'
          description='Portable disaster recovery rehearsal failed'
          if [ "$REGRESSION_OUTCOME" = 'success' ] && [ "$REHEARSAL_OUTCOME" = 'success' ] && [ "$EVIDENCE_OUTCOME" = 'success' ]; then
            state='success'
            description='Portable disaster recovery rehearsal passed'
          fi
          export STATUS_STATE="$state" STATUS_DESCRIPTION="$description"
          node - <<'NODE' > /tmp/recovery-status-final.json
          const runUrl=`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          process.stdout.write(JSON.stringify({
            state:process.env.STATUS_STATE,
            context:'Disaster Recovery Rehearsal',
            description:process.env.STATUS_DESCRIPTION,
            target_url:runUrl,
          }));
          NODE
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/recovery-status-final.json >/dev/null
