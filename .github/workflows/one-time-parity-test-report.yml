name: One-time Parity Test Report

on:
  push:
    branches: [scheduling-7shifts-parity]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-7shifts-parity
      - name: Reuse exact integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-time-parity-ui-integration.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if "python - <<'PY'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          lines=[]
          for line in src[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/integrate.py').write_text('\n'.join(lines)+'\n')
          PY
          python /tmp/integrate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture test output
        id: tests
        shell: bash
        run: |
          set +e
          npm test > parity-test-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat parity-test-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: parity-test-output
          path: parity-test-output.txt
          retention-days: 1
      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
