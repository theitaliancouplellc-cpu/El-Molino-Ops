name: One-time manager Schedule self-service RPC cleanup

on:
  push:
    branches: [employee-parity-engagement-v5]
    paths: [.github/workflows/one-time-manager-schedule-self-service-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-parity-engagement-v5
          fetch-depth: 0
      - name: Replace legacy direct employee writes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/page.tsx')
          s=p.read_text()
          replacements={
          "async function requestTimeOff(e:FormEvent){e.preventDefault();if(!me||!profile?.location_id||busy)return;if(offForm.starts_on<businessDateInZone()||offForm.ends_on<offForm.starts_on){setMessage('Choose valid future time-off dates.');return}setBusy(true);const {error}=await supabase.from('time_off_requests').insert({location_id:profile.location_id,employee_id:me.id,starts_on:offForm.starts_on,ends_on:offForm.ends_on,reason:offForm.reason.trim().slice(0,2000)||null});if(error)setMessage('Could not submit time off.');else{setMessage('Time-off request submitted.');setOffForm(x=>({...x,reason:''}));await load()}setBusy(false)}":
          "async function requestTimeOff(e:FormEvent){e.preventDefault();if(!me||busy)return;if(offForm.starts_on<businessDateInZone()||offForm.ends_on<offForm.starts_on){setMessage('Choose valid future time-off dates.');return}setBusy(true);const {error}=await supabase.rpc('submit_my_time_off_request',{p_starts_on:offForm.starts_on,p_ends_on:offForm.ends_on,p_reason:offForm.reason.trim().slice(0,2000)||null,p_category:'unpaid',p_partial_day:false,p_start_time:null,p_end_time:null});if(error)setMessage(error.message||'Could not submit time off.');else{setMessage('Time-off request submitted.');setOffForm(x=>({...x,reason:''}));await load()}setBusy(false)}",
          "async function requestCoverage(s:Shift){if(!me||s.employee_id!==me.id||busy||!profile?.location_id)return;const reason=prompt('Why do you need coverage? (optional)')||'';setBusy(true);const {error}=await supabase.from('shift_change_requests').insert({location_id:profile.location_id,shift_id:s.id,request_type:'coverage',requested_by_employee_id:me.id,reason:reason.trim().slice(0,2000)||null});if(error)setMessage('Could not request coverage.');else{setMessage('Coverage request sent to management.');await load()}setBusy(false)}":
          "async function requestCoverage(s:Shift){if(!me||s.employee_id!==me.id||busy)return;const reason=prompt('Why do you need coverage? (optional)')||'';setBusy(true);const {error}=await supabase.rpc('submit_my_shift_change_request',{p_shift_id:s.id,p_request_type:'coverage',p_target_shift_id:null,p_reason:reason.trim().slice(0,2000)||null});if(error)setMessage(error.message||'Could not request coverage.');else{setMessage('Coverage request sent to management.');await load()}setBusy(false)}",
          "async function submitSwap(){if(!me||!swapSource||!swapTarget||!profile?.location_id||busy)return;const target=periodShifts.find(s=>s.id===swapTarget);if(!target?.employee_id)return;setBusy(true);const {error}=await supabase.from('shift_change_requests').insert({location_id:profile.location_id,shift_id:swapSource,target_shift_id:target.id,request_type:'swap',requested_by_employee_id:me.id,target_employee_id:target.employee_id,reason:'Employee requested shift swap'});if(error)setMessage('Could not submit that swap request.');else{setMessage('Shift swap sent to management for review.');setSwapSource(null);setSwapTarget('');await load()}setBusy(false)}":
          "async function submitSwap(){if(!me||!swapSource||!swapTarget||busy)return;const target=periodShifts.find(s=>s.id===swapTarget);if(!target?.employee_id)return;setBusy(true);const {error}=await supabase.rpc('submit_my_shift_change_request',{p_shift_id:swapSource,p_request_type:'swap',p_target_shift_id:target.id,p_reason:'Employee requested reciprocal shift trade'});if(error)setMessage(error.message||'Could not submit that swap request.');else{setMessage('Shift trade sent to the coworker for acceptance before manager review.');setSwapSource(null);setSwapTarget('');await load()}setBusy(false)}"
          }
          for old,new in replacements.items():
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit cleanup
        run: |
          rm .github/workflows/one-time-manager-schedule-self-service-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schedule/page.tsx .github/workflows/one-time-manager-schedule-self-service-fix.yml
          git commit -m "Move manager Schedule self-service writes behind RPCs"
          git push origin HEAD:employee-parity-engagement-v5
