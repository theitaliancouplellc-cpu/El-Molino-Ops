name: Cloudflare Migration Verify

on:
  push:
    branches: [cloudflare-migration]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Test and typecheck
        run: |
          npm test
          npx tsc --noEmit
      - name: Build Next.js production app
        run: npm run build
      - name: Build Cloudflare OpenNext output
        run: npm run cf:build
      - name: Start local Cloudflare workerd runtime
        run: |
          npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Verify Cloudflare runtime health
        run: |
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok || !h.checks?.filter(c=>c.required).every(c=>c.ok)) process.exit(1)"
          curl -fsS http://127.0.0.1:8787/ > /tmp/root.html
          grep -q 'El Molino Ops' /tmp/root.html
      - name: Commit verified lockfile
        run: |
          git config user.name 'El Molino Cloudflare Migration'
          git config user.email 'cloudflare-migration@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock Cloudflare Workers dependencies'
            git push origin HEAD:cloudflare-migration
          fi
