name: One-time final cash and manager integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate cash and manager command links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/page.tsx')
          s=p.read_text()
          if 'href="/cash"' not in s:
              marker='<a className="settings-row" href="/vendors">'
              cash='<a className="settings-row" href="/cash"><span className="settings-icon"><KeyRound/></span><span><b>Cash Controls</b><small>Drawer reconciliation, deposits, safe count and over/short</small></span><ChevronRight/></a>'
              if marker not in s: raise SystemExit('cash nav marker missing')
              s=s.replace(marker,cash+marker,1)
          if 'href="/manager"' not in s:
              marker='<a className="settings-row" href="/performance">'
              manager='<a className="settings-row" href="/manager"><span className="settings-icon"><Activity/></span><span><b>Manager Dashboard</b><small>GM/MOD overview and operational exceptions</small></span><ChevronRight/></a>'
              if marker not in s: raise SystemExit('manager nav marker missing')
              s=s.replace(marker,manager+marker,1)
          p.write_text(s)

          p=Path('app/manager/page.tsx')
          s=p.read_text()
          if 'href="/performance"' not in s:
              marker='<div className="section-title"><h2>Quick management</h2><span>jump in</span></div>'
              command='''<div className="section-title"><h2>Restaurant command center</h2><span>daily systems</span></div><div className="quick-grid"><a className="quick-card" href="/performance"><ClipboardCheck/><b>Performance</b><small>Sales, labor & Toast</small></a><a className="quick-card" href="/logbook"><ClipboardCheck/><b>MOD Logbook</b><small>Shift handoff & follow-up</small></a><a className="quick-card" href="/schedule"><Users/><b>Schedule</b><small>Shifts, call-outs & time off</small></a><a className="quick-card" href="/inventory"><PackageX/><b>Inventory</b><small>Pars, ordering & food cost</small></a><a className="quick-card" href="/safety"><CheckCircle2/><b>Food Safety</b><small>Checks & temperatures</small></a><a className="quick-card" href="/maintenance"><Wrench/><b>Maintenance</b><small>Equipment & repairs</small></a><a className="quick-card" href="/training"><Users/><b>Training</b><small>Assignments & certifications</small></a><a className="quick-card" href="/incidents"><AlertTriangle/><b>Incidents</b><small>Private incident register</small></a><a className="quick-card" href="/cash"><ClipboardCheck/><b>Cash Controls</b><small>Deposits & over/short</small></a><a className="quick-card" href="/vendors"><Wrench/><b>Vendors</b><small>Accounts & service history</small></a></div>'''
              if marker not in s: raise SystemExit('manager quick section marker missing')
              s=s.replace(marker,command+marker,1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Full tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build
      - name: Commit verified integration and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-final-cash-manager-integration.yml
          git add app/page.tsx app/manager/page.tsx
          git commit -m "Integrate cash controls and restaurant command center"
          git push
