name: One-time Time Clock Tips TypeScript Fix

on:
  push:
    branches: [timeclock-tip-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeclock-tip-ui
      - name: Fix exact tip settings field mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/tips/page.tsx')
          s=p.read_text()
          old=".upsert({location_id:profile.location_id,enabled,employee_visibility},{onConflict:'location_id'})"
          new=".upsert({location_id:profile.location_id,enabled,employee_visibility:employeeVisibility},{onConflict:'location_id'})"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one settings mapping, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Regression suite
        run: npm test
      - name: Commit verified fix
        run: |
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add app/tips/page.tsx
          git commit -m "Fix tip settings visibility mapping"
          git push origin timeclock-tip-ui
