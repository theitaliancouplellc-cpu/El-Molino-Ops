name: One-time Scheduling Parity Engine

on:
  push:
    branches: [scheduling-7shifts-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-7shifts-parity
      - name: Align browser optimizer with parity rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('lib/scheduling-engine.ts')
          s=p.read_text()
          s=s.replace("export type RoleAssignment={employee_id:string;role_id:string};","export type RoleAssignment={employee_id:string;role_id:string;skill_level?:number};")
          s=s.replace("export type AvailabilityRow={employee_id:string;day_of_week:number;available_from:string|null;available_to:string|null;unavailable:boolean};","export type AvailabilityRow={employee_id:string;day_of_week:number;available_from:string|null;available_to:string|null;unavailable:boolean};\nexport type TemporaryAvailabilityRow=AvailabilityRow&{effective_from:string;effective_to:string};")
          s=s.replace("export type TimeOffRow={employee_id:string;starts_on:string;ends_on:string;status:string};","export type TimeOffRow={employee_id:string;starts_on:string;ends_on:string;status:string;category?:'unpaid'|'paid'|'paid_sick';full_day?:boolean;starts_at_time?:string|null;ends_at_time?:string|null};")
          s=s.replace("template_key?:string|null};","template_key?:string|null;required_skill_level?:number};")
          s=s.replace("availability:AvailabilityRow[];timeOff:TimeOffRow[];profiles:","availability:AvailabilityRow[];temporaryAvailability?:TemporaryAvailabilityRow[];timeOff:TimeOffRow[];profiles:")

          old="function inRange(day:string,start:string,end:string){return day>=start&&day<=end}\n"
          helper="""function inRange(day:string,start:string,end:string){return day>=start&&day<=end}\nfunction timeOffOverlapsSlot(o:TimeOffRow,slot:Slot,input:GenerateScheduleInput){if(o.full_day!==false)return inRange(slot.date,o.starts_on,o.ends_on);if(o.starts_on!==slot.date||o.ends_on!==slot.date||!o.starts_at_time||!o.ends_at_time)return false;return overlaps(slot.starts_at,slot.ends_at,zonedLocalToIso(slot.date,o.starts_at_time,input.settings.timezone),zonedLocalToIso(slot.date,o.ends_at_time,input.settings.timezone))}\nfunction availabilityForSlot(employeeId:string,slot:Slot,input:GenerateScheduleInput){const temporary=(input.temporaryAvailability??[]).filter(a=>a.employee_id===employeeId&&a.day_of_week===slot.requirement.day_of_week&&inRange(slot.date,a.effective_from,a.effective_to)).sort((a,b)=>b.effective_from.localeCompare(a.effective_from))[0];return temporary??input.availability.find(a=>a.employee_id===employeeId&&a.day_of_week===slot.requirement.day_of_week)}\n"""
          if old not in s: raise SystemExit('inRange marker missing')
          s=s.replace(old,helper,1)

          pattern=r"function staticEligibilityReasons\(employee:ScheduleEmployee,slot:Slot,input:GenerateScheduleInput,qualified:Set<string>\)\{.*?\}\nfunction gapHours"
          replacement="""function staticEligibilityReasons(employee:ScheduleEmployee,slot:Slot,input:GenerateScheduleInput,qualified:Set<string>){const reasons:string[]=[];const key=`${employee.id}:${slot.requirement.role_id}`;if(!employee.active)reasons.push('inactive');if(!qualified.has(key))reasons.push('not_qualified');else{const assignment=input.roleAssignments.find(a=>a.employee_id===employee.id&&a.role_id===slot.requirement.role_id);if((assignment?.skill_level??1)<(slot.requirement.required_skill_level??1))reasons.push('insufficient_skill')}if(input.timeOff.some(o=>o.employee_id===employee.id&&o.status==='approved'&&timeOffOverlapsSlot(o,slot,input)))reasons.push('approved_time_off');const av=availabilityForSlot(employee.id,slot,input);if(av){if(av.unavailable)reasons.push('unavailable');else{const from=timeMinutes(av.available_from),to=timeMinutes(av.available_to),st=timeMinutes(slot.requirement.starts_at),en=timeMinutes(slot.requirement.ends_at);if(from===null||to===null||st===null||en===null||st<from||en>to)reasons.push('outside_availability')}}const p=profileFor(input,employee.id);if(slot.hours>p.max_shift_hours+1e-6)reasons.push('max_shift_hours');return reasons}\nfunction gapHours"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('static eligibility replacement failed')
          s=s.replace("const pending=input.timeOff.some(o=>o.employee_id===employee.id&&o.status==='pending'&&inRange(slot.date,o.starts_on,o.ends_on));","const pending=input.timeOff.some(o=>o.employee_id===employee.id&&o.status==='pending'&&timeOffOverlapsSlot(o,slot,input));")
          p.write_text(s)

          p=Path('app/schedule/page.tsx')
          s=p.read_text()
          s=s.replace("type AvailabilityRow,type CoverageRequirement,type ExistingShift,type GenerateScheduleInput,type ScheduleGenerationResult,type ScheduleProfile","type AvailabilityRow,type TemporaryAvailabilityRow,type CoverageRequirement,type ExistingShift,type GenerateScheduleInput,type ScheduleGenerationResult,type ScheduleProfile")
          s=s.replace("type RoleAssignment={employee_id:string;role_id:string};","type RoleAssignment={employee_id:string;role_id:string;skill_level?:number};")
          s=s.replace("type TimeOff={id:string;employee_id:string;starts_on:string;ends_on:string;reason:string|null;status:string;created_at:string};","type TimeOff={id:string;employee_id:string;starts_on:string;ends_on:string;reason:string|null;status:string;created_at:string;category?:'unpaid'|'paid'|'paid_sick';full_day?:boolean;starts_at_time?:string|null;ends_at_time?:string|null};")
          s=s.replace("[availability,setAvailability]=useState<AvailabilityRow[]>([]),[availDraft", "[availability,setAvailability]=useState<AvailabilityRow[]>([]),[temporaryAvailability,setTemporaryAvailability]=useState<TemporaryAvailabilityRow[]>([]),[availDraft")
          s=s.replace("const [e,r,ra,av,o,sh,c,sp,cr,cl]=await Promise.all([","const [e,r,ra,av,tav,o,sh,c,sp,cr,cl]=await Promise.all([")
          s=s.replace("supabase.from('employee_role_assignments').select('employee_id,role_id'),","supabase.from('employee_role_assignments').select('employee_id,role_id,skill_level'),")
          s=s.replace("supabase.from('employee_availability').select('employee_id,day_of_week,available_from,available_to,unavailable').eq('location_id',locationId),","supabase.from('employee_availability').select('employee_id,day_of_week,available_from,available_to,unavailable').eq('location_id',locationId),\n        supabase.from('employee_availability_overrides').select('employee_id,day_of_week,available_from,available_to,unavailable,effective_from,effective_to').eq('location_id',locationId).lte('effective_from',toDay).gte('effective_to',fromDay),")
          s=s.replace("select('id,employee_id,starts_on,ends_on,reason,status,created_at')","select('id,employee_id,starts_on,ends_on,reason,status,created_at,category,full_day,starts_at_time,ends_at_time')")
          s=s.replace("template_key').eq('location_id'","template_key,required_skill_level').eq('location_id'")
          s=s.replace("const all=[e,r,ra,av,o,sh,c,sp,cr,cl];","const all=[e,r,ra,av,tav,o,sh,c,sp,cr,cl];")
          s=s.replace("setRoleAssignments((ra.data??[]) as RoleAssignment[]);setAvailability(avs);setTimeOff", "setRoleAssignments((ra.data??[]) as RoleAssignment[]);setAvailability(avs);setTemporaryAvailability((tav.data??[]) as TemporaryAvailabilityRow[]);setTimeOff")
          s=s.replace("priority:asNum(x.priority,50)}))", "priority:asNum(x.priority,50),required_skill_level:asNum(x.required_skill_level,1)}))")
          s=s.replace("return {period,employees,roles,roleAssignments,availability,timeOff,profiles,requirements", "return {period,employees,roles,roleAssignments,availability,temporaryAvailability,timeOff,profiles,requirements")
          p.write_text(s)

          t=Path('tests/scheduling-parity-engine.test.ts')
          t.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {generateSchedule,type GenerateScheduleInput} from '../lib/scheduling-engine';\n\nconst period={id:'p',starts_on:'2026-08-17',ends_on:'2026-08-23',revision:0,status:'draft'};\nconst employee={id:'e',full_name:'E',active:true};\nconst req=(overrides:any={})=>({id:'r',name:'Server',day_of_week:1,role_id:'server',starts_at:'10:30:00',ends_at:'14:30:00',min_staff:1,target_staff:1,max_staff:1,break_minutes:0,priority:50,shift_type:'opening' as const,active:true,effective_from:null,effective_to:null,required_skill_level:1,...overrides});\nconst input=(overrides:Partial<GenerateScheduleInput>={}):GenerateScheduleInput=>({period,employees:[employee],roles:[{id:'server',name:'Server'}],roleAssignments:[{employee_id:'e',role_id:'server',skill_level:1}],availability:[],temporaryAvailability:[],timeOff:[],profiles:[{employee_id:'e',min_weekly_hours:0,target_weekly_hours:40,max_weekly_hours:60,max_shift_hours:12,min_rest_hours:8,max_consecutive_days:6,hourly_rate:15,avoid_overtime:true,preferred_days_off:[],preferred_start:null,preferred_end:null,allow_split_shifts:true,min_split_gap_hours:.5}],requirements:[req()],existingShifts:[],settings:{timezone:'America/New_York',overtime_after_hours:40,mode:'target',preserve_manual_shifts:true},...overrides});\n\ntest('temporary availability overrides recurring availability for its effective dates',()=>{const x=generateSchedule(input({availability:[{employee_id:'e',day_of_week:1,available_from:'12:00',available_to:'20:00',unavailable:false}],temporaryAvailability:[{employee_id:'e',day_of_week:1,available_from:'10:00',available_to:'22:00',unavailable:false,effective_from:'2026-08-17',effective_to:'2026-08-17'}]}));assert.equal(x.metrics.assigned_slots,1)});\n\ntest('coverage skill requirement rejects an employee below the required level',()=>{const x=generateSchedule(input({requirements:[req({required_skill_level:2})]}));assert.equal(x.metrics.open_slots,1);assert.equal((x.issues.find(i=>i.code==='unfilled_coverage')?.details?.eligibility_blocks as any).insufficient_skill,1)});\n\ntest('coverage skill requirement accepts a sufficiently skilled employee',()=>{const x=generateSchedule(input({roleAssignments:[{employee_id:'e',role_id:'server',skill_level:3}],requirements:[req({required_skill_level:2})]}));assert.equal(x.metrics.assigned_slots,1)});\n\ntest('partial-day approved time off blocks only overlapping shift hours',()=>{const off=[{employee_id:'e',starts_on:'2026-08-17',ends_on:'2026-08-17',status:'approved',full_day:false,starts_at_time:'15:00',ends_at_time:'17:00'}];const morning=generateSchedule(input({timeOff:off,requirements:[req()]}));assert.equal(morning.metrics.assigned_slots,1);const afternoon=generateSchedule(input({timeOff:off,requirements:[req({starts_at:'15:30:00',ends_at:'18:00:00'})]}));assert.equal(afternoon.metrics.open_slots,1)});\n\ntest('pending partial-day time off is a soft warning only when hours overlap',()=>{const x=generateSchedule(input({timeOff:[{employee_id:'e',starts_on:'2026-08-17',ends_on:'2026-08-17',status:'pending',full_day:false,starts_at_time:'11:00',ends_at_time:'12:00'}]}));assert.equal(x.metrics.assigned_slots,1);assert.ok(x.issues.some(i=>i.code==='pending_time_off'))});\n""")
          PY
      - name: Verify optimizer parity
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm run build
          npm run cf:build
          npx wrangler deploy --dry-run
      - name: Commit verified parity engine
        run: |
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add lib/scheduling-engine.ts app/schedule/page.tsx tests/scheduling-parity-engine.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align scheduler with temporary availability time off and skills"
          git push origin HEAD:scheduling-7shifts-parity
