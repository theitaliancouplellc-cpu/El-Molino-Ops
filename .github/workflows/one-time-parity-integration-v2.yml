name: One-time 7shifts Parity Integration v2

on:
  push:
    branches: [scheduling-7shifts-parity]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-7shifts-parity
      - name: Reuse exact parity integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-time-parity-ui-integration.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if "python - <<'PY'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          lines=[]
          for line in src[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/integrate.py').write_text('\n'.join(lines)+'\n')
          PY
          python /tmp/integrate.py
      - name: Preserve explicit Shift Pool responsibility contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/page.tsx')
          s=p.read_text()
          s=s.replace('You remain responsible until another employee is approved and the schedule is reassigned.','You remain responsible for it until another employee is approved and the schedule is reassigned.')
          p.write_text(s)
          PY
      - name: Wrap publish controls in a JSX fragment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/page.tsx')
          s=p.read_text()
          old='<button className={styles.button} disabled={busy} onClick={publishPeriod}>Publish Entire Schedule</button><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/publish">Publish Center</Link>'
          new='<><button className={styles.button} disabled={busy} onClick={publishPeriod}>Publish Entire Schedule</button><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/publish">Publish Center</Link></>'
          if old not in s:
              raise SystemExit('publish control marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
      - name: Cloudflare OpenNext build
        run: npm run cf:build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit verified parity integration
        run: |
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add lib/scheduling-engine.ts app/schedule/page.tsx app/schedule/settings/page.tsx tests/scheduling-segmented-coverage.test.ts tests/scheduling-parity-ui-contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate 7shifts parity tools into Schedule"
          git push origin HEAD:scheduling-7shifts-parity
