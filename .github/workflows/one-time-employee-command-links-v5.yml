name: One-time employee command-link cleanup

on:
  push:
    branches: [employee-parity-engagement-v5]
    paths: [.github/workflows/one-time-employee-command-links-v5.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-parity-engagement-v5
          fetch-depth: 0
      - name: Point command palette at dedicated employee routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/global-actions.tsx')
          s=p.read_text()
          replacements={
            "href:'/schedule/pool'":"href:'/employee/shift-pool'",
            "href:'/schedule/requests'":"href:'/employee/requests'",
            "href:'/team'":"href:'/employee/team'",
            "href:'/training/courses'":"href:'/employee/training'",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected employee command: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-employee-command-links-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/global-actions.tsx .github/workflows/one-time-employee-command-links-v5.yml
          git commit -m "Point employee commands at dedicated staff surfaces"
          git push origin HEAD:employee-parity-engagement-v5
