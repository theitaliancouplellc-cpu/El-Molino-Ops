name: One-time employee schedule cache integration
on:
  push:
    branches: [employee-parity-mobile-offline-v6]
    paths: [.github/workflows/one-time-employee-schedule-cache-v6.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-parity-mobile-offline-v6
          fetch-depth: 0
      - name: Add last-known-good schedule behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/employee/schedule/page.tsx')
          s=p.read_text()
          s=s.replace("import {addDateDays,dateDayOfWeek,shiftNetHours,zonedLocalToIso} from '@/lib/scheduling-engine';", "import {addDateDays,dateDayOfWeek,shiftNetHours,zonedLocalToIso} from '@/lib/scheduling-engine';\nimport {employeeScheduleCacheAge,readEmployeeScheduleCache,writeEmployeeScheduleCache} from '@/lib/employee-schedule-cache';")
          s=s.replace("const [ready,setReady]=useState(false),[busy,setBusy]=useState(false),[message,setMessage]=useState(''),[profile,setProfile]", "const [ready,setReady]=useState(false),[busy,setBusy]=useState(false),[message,setMessage]=useState(''),[cachedAt,setCachedAt]=useState<string|null>(null),[online,setOnline]=useState(true),[profile,setProfile]")
          s=s.replace("useEffect(()=>{void init()},[]);", "useEffect(()=>{void init();const sync=()=>setOnline(navigator.onLine);sync();addEventListener('online',sync);addEventListener('offline',sync);return()=>{removeEventListener('online',sync);removeEventListener('offline',sync)}},[]);")
          pat=r" async function loadWeek\(emp=employeeId,ws=weekStart\)\{.*?\n async function changeWeek"
          repl=""" async function loadWeek(emp=employeeId,ws=weekStart){if(!emp)return;setBusy(true);setMessage('');const tz='America/New_York',from=zonedLocalToIso(ws,'00:00:00',tz),to=zonedLocalToIso(addDateDays(ws,7),'00:00:00',tz);const [p,s,r,b]=await Promise.all([\n  supabase.from('schedule_periods').select('id,starts_on,ends_on,status,revision,published_at').eq('starts_on',ws).eq('ends_on',addDateDays(ws,6)).maybeSingle(),\n  supabase.from('schedule_shifts').select('id,employee_id,role_id,starts_at,ends_at,break_minutes,status,notes,coverage_requirement_id').eq('employee_id',emp).in('status',['scheduled','covered']).gte('starts_at',from).lt('starts_at',to).order('starts_at'),\n  supabase.from('employee_roles').select('id,name').order('name'),\n  supabase.from('schedule_shift_breaks').select('id,shift_id,starts_at,duration_minutes,paid,status').gte('starts_at',from).lt('starts_at',to).order('starts_at')\n ]);const failed=[p,s,r,b].some(x=>x.error);if(failed){const cached=readEmployeeScheduleCache<Period,Shift,Role,BreakRow>(emp,ws);if(cached){setPeriod(cached.period);setShifts(cached.shifts);setRoles(cached.roles);setBreaks(cached.breaks);setCachedAt(cached.savedAt);setMessage(`Connection unavailable. Showing ${employeeScheduleCacheAge(cached.savedAt)}.`)}else setMessage('Schedule could not be refreshed and no saved copy is available for this week.')}else{const nextPeriod=(p.data??null) as Period|null,nextShifts=(s.data??[]) as Shift[],nextRoles=(r.data??[]) as Role[],nextBreaks=(b.data??[]) as BreakRow[];setPeriod(nextPeriod);setShifts(nextShifts);setRoles(nextRoles);setBreaks(nextBreaks);setCachedAt(null);writeEmployeeScheduleCache({employeeId:emp,weekStart:ws,period:nextPeriod,shifts:nextShifts,roles:nextRoles,breaks:nextBreaks})}setSwapSource(null);setSwapTarget('');setSwapCandidates([]);setBusy(false)}\n function requireConnection(){if(online&&navigator.onLine)return true;setMessage('You are offline. Schedule changes require a connection.');return false}\n async function changeWeek"""
          s,n=re.subn(pat,repl,s,flags=re.S)
          if n!=1: raise SystemExit(f'loadWeek replacement count {n}')
          for name in ['offer','coverage','beginTrade']:
              s=s.replace(f"async function {name}(s:Shift){{if(busy)return;",f"async function {name}(s:Shift){{if(busy||!requireConnection())return;")
          s=s.replace("async function submitSwap(){if(busy||!swapSource||!swapTarget)return;", "async function submitSwap(){if(busy||!swapSource||!swapTarget||!requireConnection())return;")
          s=s.replace("{message&&<div className={styles.notice}>{message}</div>}", "{message&&<div className={styles.notice}>{message}</div>}{cachedAt&&<div className={styles.notice} role=\"status\">Saved schedule · {employeeScheduleCacheAge(cachedAt)} · view only until reconnected.</div>}",1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-employee-schedule-cache-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/employee/schedule/page.tsx .github/workflows/one-time-employee-schedule-cache-v6.yml
          git commit -m "Add last-known employee schedule cache"
          git push origin HEAD:employee-parity-mobile-offline-v6
