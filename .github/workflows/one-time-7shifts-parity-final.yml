name: One-time 7shifts Parity Final

on:
  push:
    branches: [scheduling-7shifts-parity]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-7shifts-parity
      - name: Integrate expanded parity routes and events
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/page.tsx');s=p.read_text()
          old='<Link className={`${styles.button} ${styles.secondary}`} href="/schedule/warnings">Warnings & Quick Fix</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/breaks">Breaks</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/publish">Publish Center</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/settings">Settings</Link>'
          new='<Link className={`${styles.button} ${styles.secondary}`} href="/schedule/warnings">Warnings & Quick Fix</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/labor">Labor Budget</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/attendance">Attendance</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/compliance">Compliance</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/templates">Copy & Templates</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/activity">Activity Log</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/team">Team Notes</Link><Link className={`${styles.button} ${styles.secondary}`} href="/calendar">Events</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/breaks">Breaks</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/publish">Publish Center</Link><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/settings">Settings</Link>'
          if old not in s: raise SystemExit('schedule hub marker missing')
          p.write_text(s.replace(old,new,1))
          p=Path('app/schedule/views/page.tsx');s=p.read_text()
          old="type Employee={id:string;full_name:string};type Role={id:string;name:string;department:string|null};type Shift={id:string;employee_id:string|null;role_id:string|null;starts_at:string;ends_at:string;status:string;notes:string|null;source:string|null};"
          new=old+"type Event={id:string;title:string;event_type:string;starts_at:string;ends_at:string;all_day:boolean;description:string|null};"
          if 'type Event=' not in s:
            if old not in s: raise SystemExit('schedule views type marker missing')
            s=s.replace(old,new,1)
          old_state="[roles,setRoles]=useState<Role[]>([]),[shifts,setShifts]=useState<Shift[]>([]),[anchor,setAnchor]"
          new_state="[roles,setRoles]=useState<Role[]>([]),[shifts,setShifts]=useState<Shift[]>([]),[events,setEvents]=useState<Event[]>([]),[anchor,setAnchor]"
          if '[events,setEvents]' not in s:
            if old_state not in s: raise SystemExit('schedule views state marker missing')
            s=s.replace(old_state,new_state,1)
          s=s.replace("const [e,r,s]=await Promise.all([","const [e,r,s,ev]=await Promise.all([",1)
          marker=".neq('status','cancelled').order('starts_at')]);if(s.error)setMessage(s.error.message);"
          replacement=".neq('status','cancelled').order('starts_at'),supabase.from('calendar_events').select('id,title,event_type,starts_at,ends_at,all_day,description').eq('location_id',loc).gte('starts_at',from.toISOString()).lt('starts_at',to.toISOString()).is('deleted_at',null).order('starts_at')]);if(s.error)setMessage(s.error.message);"
          if "from('calendar_events')" not in s:
            if marker not in s: raise SystemExit('schedule views query marker missing')
            s=s.replace(marker,replacement,1)
          old_set="setShifts((s.data??[]) as Shift[]);setReady(true)"
          new_set="setShifts((s.data??[]) as Shift[]);setEvents((ev.data??[]) as Event[]);setReady(true)"
          if old_set in s:s=s.replace(old_set,new_set,1)
          old_map="{visibleDates.map(date=>{const ds=visible.filter(s=>localDate(s.starts_at)===date);return <div"
          new_map="{visibleDates.map(date=>{const ds=visible.filter(s=>localDate(s.starts_at)===date);const es=events.filter(ev=>localDate(ev.starts_at)===date);return <div"
          if old_map in s:s=s.replace(old_map,new_map,1)
          old_list='<div className={styles.list}>{ds.map(s=>'
          new_list='<div className={styles.list}>{es.map(ev=><div className={styles.entry} key={\'event-\'+ev.id}><b>EVENT · {ev.title}</b><small>{ev.all_day?\'All day\':fmtTime(ev.starts_at)+\'–\'+fmtTime(ev.ends_at)} · {ev.event_type}</small>{ev.description&&<small>{ev.description}</small>}</div>)}{ds.map(s=>'
          if old_list in s:s=s.replace(old_list,new_list,1)
          p.write_text(s)
          p=Path('tests/scheduling-parity-ui-contract.test.ts');t=p.read_text()
          t=t.replace("'/schedule/publish','/schedule/settings'","'/schedule/publish','/schedule/settings','/schedule/labor','/schedule/attendance','/schedule/compliance','/schedule/templates','/schedule/activity','/schedule/team','/calendar'")
          extra="\ntest('expanded scheduling parity workspaces keep their real backend contracts',()=>{\n const labor=readFileSync('app/schedule/labor/page.tsx','utf8'),attendance=readFileSync('app/schedule/attendance/page.tsx','utf8'),compliance=readFileSync('app/schedule/compliance/page.tsx','utf8'),templates=readFileSync('app/schedule/templates/page.tsx','utf8'),activity=readFileSync('app/schedule/activity/page.tsx','utf8'),team=readFileSync('app/schedule/team/page.tsx','utf8'),warnings=readFileSync('app/schedule/warnings/page.tsx','utf8'),views=readFileSync('app/schedule/views/page.tsx','utf8');\n assert.match(labor,/schedule_labor_budget_report/);assert.match(attendance,/record_schedule_attendance_flag/);assert.match(compliance,/schedule_compliance_warnings/);assert.match(compliance,/set_schedule_school_day/);assert.match(templates,/copy_schedule_period/);assert.match(templates,/save_schedule_period_as_template/);assert.match(templates,/duplicate_schedule_shift/);assert.match(activity,/schedule_shift_change_log/);assert.match(activity,/shift_pool_offers/);assert.match(team,/employee_schedule_profiles/);assert.match(warnings,/schedule_compliance_warnings/);assert.match(views,/calendar_events/);\n});\n"
          if 'expanded scheduling parity workspaces' not in t:t+=extra
          p.write_text(t)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
      - name: Cloudflare OpenNext build
        run: npm run cf:build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit verified expanded parity integration
        run: |
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add app/schedule/page.tsx app/schedule/views/page.tsx tests/scheduling-parity-ui-contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose expanded 7shifts scheduling parity"
          git push origin HEAD:scheduling-7shifts-parity
