name: El Molino Ops Native Beta Request

on:
  push:
    branches:
      - main
    paths:
      - .github/native-beta-request.json

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: native-beta-request
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch and observe exact-SHA Staff beta
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      REQUEST_FILE: .github/native-beta-request.json
      CANONICAL_PRODUCTION_ORIGIN: https://el-molino-ops.el-molino-ops-7537172ca8.workers.dev
      STATUS_CONTEXT: Native Beta Distribution
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate request and exact source identity
        id: request
        shell: bash
        run: |
          set -euo pipefail

          test -f "$REQUEST_FILE" || { echo '::error::Native beta request file is missing'; exit 1; }
          REQUEST_JSON="$(cat "$REQUEST_FILE")"
          export REQUEST_JSON

          ENABLED="$(node -e "const r=JSON.parse(process.env.REQUEST_JSON);process.stdout.write(String(r.enabled===true))")"
          test "$ENABLED" = 'true' || { echo '::error::Native beta request is not enabled'; exit 1; }

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Push SHA is not a full lowercase Git SHA'; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo '::error::Checked-out request commit does not match github.sha'; exit 1; }

          node <<'NODE' > "$RUNNER_TEMP/native-beta-inputs.env"
          const request = JSON.parse(process.env.REQUEST_JSON);
          const versionName = String(request.version_name ?? '');
          const buildNumber = String(request.build_number ?? '');
          const track = String(request.google_play_track ?? '');

          if (!/^\d+(\.\d+){1,2}$/.test(versionName)) throw new Error('version_name must contain 2 or 3 numeric components');
          if (!/^[1-9]\d*$/.test(buildNumber)) throw new Error('build_number must be a positive integer');
          if (Number(buildNumber) > 2100000000) throw new Error('build_number exceeds Android versionCode maximum');
          if (track !== 'internal' && track !== 'closed') throw new Error('google_play_track must be internal or closed');

          console.log(`version_name=${versionName}`);
          console.log(`build_number=${buildNumber}`);
          console.log(`google_play_track=${track}`);
          NODE

          cat "$RUNNER_TEMP/native-beta-inputs.env" >> "$GITHUB_OUTPUT"

      - name: Publish pending native beta status
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/native-beta-status.json"
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: process.env.STATUS_CONTEXT,
            description: 'Waiting for exact canonical production before beta distribution',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @"$RUNNER_TEMP/native-beta-status.json" >/dev/null

      - name: Wait for exact certified canonical production
        shell: bash
        run: |
          set -euo pipefail
          converged=false

          for attempt in {1..120}; do
            STATUS_JSON="$RUNNER_TEMP/commit-status.json"
            HEALTH_BODY="$RUNNER_TEMP/native-beta-health.json"
            HEALTH_HEADERS="$RUNNER_TEMP/native-beta-health.headers"

            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/status" > "$STATUS_JSON"

            CLOUDFLARE_STATUS="$(STATUS_JSON="$STATUS_JSON" node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.env.STATUS_JSON,'utf8'));const row=s.statuses?.find(x=>x.context==='Cloudflare Production');process.stdout.write(row?.state||'missing')")"

            CODE="$(curl --silent --show-error \
              --output "$HEALTH_BODY" \
              --dump-header "$HEALTH_HEADERS" \
              --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              "$CANONICAL_PRODUCTION_ORIGIN/api/health?release=$RELEASE_SHA&native_beta_attempt=$attempt" || true)"

            BODY_SHA="$(HEALTH_BODY="$HEALTH_BODY" node -e "const fs=require('fs');try{const h=JSON.parse(fs.readFileSync(process.env.HEALTH_BODY,'utf8'));process.stdout.write(h.release?.sha||'')}catch{}")"
            HEADER_SHA="$(tr -d '\r' < "$HEALTH_HEADERS" | awk -F': ' 'tolower($1)=="x-el-molino-release"{print $2}' | tail -n1)"
            HEALTH_OK="$(HEALTH_BODY="$HEALTH_BODY" node -e "const fs=require('fs');try{const h=JSON.parse(fs.readFileSync(process.env.HEALTH_BODY,'utf8'));process.stdout.write(String(Boolean(h.ok&&h.checks?.filter(c=>c.required).every(c=>c.ok))))}catch{process.stdout.write('false')}")"

            if [ "$CLOUDFLARE_STATUS" = 'success' ] && [ "$CODE" = '200' ] && [ "$BODY_SHA" = "$RELEASE_SHA" ] && [ "$HEADER_SHA" = "$RELEASE_SHA" ] && [ "$HEALTH_OK" = 'true' ]; then
              if curl --fail --silent --show-error \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                "$CANONICAL_PRODUCTION_ORIGIN/?release=$RELEASE_SHA" | grep -q 'El Molino Ops'; then
                converged=true
                break
              fi
            fi

            echo "Production not certified for beta yet (attempt $attempt/120; Cloudflare Production=$CLOUDFLARE_STATUS; HTTP=$CODE)."
            sleep 5
          done

          test "$converged" = true || { echo '::error::Canonical production did not certify the exact beta release within 10 minutes'; exit 1; }

      - name: Dispatch hardened native beta workflow
        id: dispatch
        shell: bash
        env:
          VERSION_NAME: ${{ steps.request.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.request.outputs.build_number }}
          GOOGLE_PLAY_TRACK: ${{ steps.request.outputs.google_play_track }}
        run: |
          set -euo pipefail
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"

          node <<'NODE' > "$RUNNER_TEMP/native-beta-dispatch.json"
          const payload = {
            ref: 'main',
            inputs: {
              release_sha: process.env.RELEASE_SHA,
              server_url: process.env.CANONICAL_PRODUCTION_ORIGIN,
              version_name: process.env.VERSION_NAME,
              build_number: process.env.BUILD_NUMBER,
              distribution_mode: 'beta',
              google_play_track: process.env.GOOGLE_PLAY_TRACK,
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          HTTP_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/native-beta-dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/native-release.yml/dispatches" \
            --data-binary @"$RUNNER_TEMP/native-beta-dispatch.json")"

          if [ "$HTTP_CODE" != '204' ]; then
            echo "::error::Native beta workflow dispatch failed with HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/native-beta-dispatch-response.txt"
            exit 1
          fi

      - name: Resolve dispatched native release run
        id: native_run
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          native_run_id=''
          native_run_url=''

          for attempt in {1..60}; do
            RUNS_JSON="$RUNNER_TEMP/native-release-runs.json"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/native-release.yml/runs?event=workflow_dispatch&branch=main&per_page=30" > "$RUNS_JSON"

            MATCH="$(RUNS_JSON="$RUNS_JSON" DISPATCHED_AT="$DISPATCHED_AT" RELEASE_SHA="$RELEASE_SHA" node -e 'const fs=require("fs");const runs=JSON.parse(fs.readFileSync(process.env.RUNS_JSON,"utf8")).workflow_runs||[];const floor=Date.parse(process.env.DISPATCHED_AT)-5000;const run=runs.find(r=>r.head_sha===process.env.RELEASE_SHA&&Date.parse(r.created_at)>=floor);if(run)process.stdout.write(`${run.id}|${run.html_url}`);')"

            if [ -n "$MATCH" ]; then
              native_run_id="${MATCH%%|*}"
              native_run_url="${MATCH#*|}"
              break
            fi

            echo "Waiting for native-release workflow run to appear (attempt $attempt/60)."
            sleep 2
          done

          test -n "$native_run_id" || { echo '::error::Dispatched native beta run could not be resolved'; exit 1; }
          echo "run_id=$native_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$native_run_url" >> "$GITHUB_OUTPUT"

          NATIVE_RUN_URL="$native_run_url" node <<'NODE' > "$RUNNER_TEMP/native-beta-status.json"
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: process.env.STATUS_CONTEXT,
            description: 'Native beta build/store upload is running',
            target_url: process.env.NATIVE_RUN_URL,
          }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @"$RUNNER_TEMP/native-beta-status.json" >/dev/null

      - name: Wait for native beta build and store upload
        id: result
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ steps.native_run.outputs.run_id }}
          NATIVE_RUN_URL: ${{ steps.native_run.outputs.run_url }}
        run: |
          set -euo pipefail
          conclusion=''

          for attempt in {1..400}; do
            RUN_JSON="$RUNNER_TEMP/native-release-run.json"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${NATIVE_RUN_ID}" > "$RUN_JSON"

            STATUS="$(RUN_JSON="$RUN_JSON" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUN_JSON,'utf8'));process.stdout.write(r.status||'unknown')")"
            conclusion="$(RUN_JSON="$RUN_JSON" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUN_JSON,'utf8'));process.stdout.write(r.conclusion||'')")"

            if [ "$STATUS" = 'completed' ]; then
              break
            fi

            echo "Native beta run $NATIVE_RUN_ID is $STATUS (attempt $attempt/400)."
            sleep 10
          done

          test -n "$conclusion" || { echo '::error::Native beta run did not complete within the observation window'; exit 1; }
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

          final_state='failure'
          description="Native beta distribution failed: $conclusion"
          if [ "$conclusion" = 'success' ]; then
            final_state='success'
            description='Native beta build and store upload completed successfully'
          fi

          FINAL_STATE="$final_state" DESCRIPTION="$description" node <<'NODE' > "$RUNNER_TEMP/native-beta-status.json"
          process.stdout.write(JSON.stringify({
            state: process.env.FINAL_STATE,
            context: process.env.STATUS_CONTEXT,
            description: process.env.DESCRIPTION.slice(0,140),
            target_url: process.env.NATIVE_RUN_URL,
          }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @"$RUNNER_TEMP/native-beta-status.json" >/dev/null

          {
            echo '## Staff native beta distribution'
            echo
            echo "- Exact release SHA: \`$RELEASE_SHA\`"
            echo "- Native release run: \`$NATIVE_RUN_ID\`"
            echo "- Conclusion: \`$conclusion\`"
            echo "- Canonical origin: \`$CANONICAL_PRODUCTION_ORIGIN\`"
            echo "- Native release URL: $NATIVE_RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$conclusion" = 'success' || { echo "::error::Native beta distribution run concluded $conclusion"; exit 1; }

      - name: Publish failed native beta orchestration status
        if: ${{ failure() && steps.result.outcome != 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/native-beta-status.json"
          process.stdout.write(JSON.stringify({
            state: 'failure',
            context: process.env.STATUS_CONTEXT,
            description: 'Native beta orchestration failed before store result was recorded',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @"$RUNNER_TEMP/native-beta-status.json" >/dev/null
