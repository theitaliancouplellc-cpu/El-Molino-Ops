name: One-time add Performance navigation link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Performance to More menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          needle='<div className="settings-list"><MoreLink icon={<BookOpen/>} title="Knowledge Studio" body="Stations, internal knowledge and public research" onClick={()=>p.setSection(\'knowledge\')}/><a className="settings-row" href="/menu">'
          replacement='<div className="settings-list"><MoreLink icon={<BookOpen/>} title="Knowledge Studio" body="Stations, internal knowledge and public research" onClick={()=>p.setSection(\'knowledge\')}/><a className="settings-row" href="/performance"><span className="settings-icon"><Activity/></span><span><b>Performance</b><small>Sales, labor, Toast imports and weekly trends</small></span><ChevronRight/></a><a className="settings-row" href="/menu">'
          if '/performance' not in s:
              if needle not in s: raise SystemExit('More menu marker not found')
              s=s.replace(needle,replacement,1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build
      - name: Commit navigation and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-add-performance-link.yml
          git rm -f .github/workflows/one-time-primary-agent-upgrade.yml 2>/dev/null || true
          git add app/page.tsx
          git commit -m "Add Performance to restaurant operations navigation"
          git push
