name: One-time runtime hardening

on:
  push:
    branches: [main]

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove runtime Supabase fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/supabase.ts')
          s = p.read_text()
          lines = s.splitlines()
          out = []
          for line in lines:
              if line.startswith('const supabaseUrl = '):
                  out.append("const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;")
              elif line.startswith('const supabasePublishableKey = '):
                  out.append("const supabasePublishableKey = process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;")
              else:
                  out.append(line)
          text = '\n'.join(out) + '\n'
          text = text.replace("export const supabase = createClient(supabaseUrl, supabasePublishableKey, {", "if (!supabaseUrl || !supabasePublishableKey) throw new Error('Supabase public configuration is missing.');\n\nexport const supabase = createClient(supabaseUrl, supabasePublishableKey, {")
          p.write_text(text)

          p = Path('app/api/ask/route.ts')
          s = p.read_text()
          s = s.replace("const url=process.env.NEXT_PUBLIC_SUPABASE_URL||", "const url=process.env.NEXT_PUBLIC_SUPABASE_URL||")
          lines = s.splitlines()
          out = []
          for line in lines:
              if "const url=process.env.NEXT_PUBLIC_SUPABASE_URL||" in line:
                  prefix = line.split("const url=",1)[0]
                  out.append(prefix + "const url=process.env.NEXT_PUBLIC_SUPABASE_URL;")
              elif "const anon=process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY||" in line:
                  prefix = line.split("const anon=",1)[0]
                  out.append(prefix + "const anon=process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY||process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;")
              else:
                  out.append(line)
          text = '\n'.join(out) + '\n'
          text = text.replace("const client=createClient(url,anon,", "if(!url||!anon)return null;\n  const client=createClient(url,anon,")
          p.write_text(text)
          PY
      - name: Commit hardened runtime config
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase.ts app/api/ask/route.ts
          git commit -m "Remove remaining runtime Supabase fallbacks"
          git push
