name: El Molino Ops CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build and regression suite
        run: npm run build
      - name: Build Cloudflare OpenNext worker
        run: npm run cf:build
      - name: Validate Cloudflare worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/cloudflare-dry-run
      - name: Smoke test Cloudflare workerd runtime
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          test -s /tmp/health.json || { cat /tmp/wrangler.log; exit 1; }
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok || !h.checks?.filter(c=>c.required).every(c=>c.ok)) process.exit(1)"
          curl -fsS http://127.0.0.1:8787/ > /tmp/root.html
          grep -q 'El Molino Ops' /tmp/root.html

  browser-acceptance:
    name: Chromium and WebKit acceptance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify pinned Playwright runtime
        run: |
          node -e "const v=require('@playwright/test/package.json').version; if(v!=='1.62.1') throw new Error('Unexpected Playwright version '+v)"
          test -d /ms-playwright
      - name: Build application for browser acceptance
        run: npm run build
      - name: Run production browser acceptance matrix
        run: npx playwright test
      - name: Preserve Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  phase1-vercel-prebuilt-preview:
    name: Phase 1 exact-head Vercel prebuilt preview
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ops/phase1-vercel-prebuilt-runner' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: e03ed65b5af4174c8430df9c9e761c21d9bac705
      VERCEL_ORG_ID: team_FuDhMvN3hlJNGfM6tfPRVpFb
      VERCEL_PROJECT_ID: prj_zfyH8VmoUqWZj3gbiw56IMxncnxv
      VERCEL_SCOPE: theitaliancouplellc-1161s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 58.4.4
    steps:
      - name: Validate Vercel deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::Required GitHub Actions secret VERCEL_TOKEN is unavailable. Exact-head prebuilt Vercel preview cannot be created safely.'
            exit 1
          fi

      - name: Checkout immutable PR 120 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Prove immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$TARGET_SHA" || { echo "::error::Checked out $ACTUAL_SHA, expected $TARGET_SHA"; exit 1; }
          test -z "$(git status --porcelain)" || { echo '::error::Exact-head checkout is not clean'; git status --short; exit 1; }
          echo "Exact source SHA: $ACTUAL_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Pull legitimate Vercel Preview configuration
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --git-branch=staff/phase1-release-boundary --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(p.orgId!==process.env.VERCEL_ORG_ID) throw new Error(`Vercel org mismatch: ${p.orgId}`);
          if(p.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error(`Vercel project mismatch: ${p.projectId}`);
          if(!fs.existsSync('.vercel/.env.preview.local')) throw new Error('Preview environment configuration was not pulled');
          console.log('Preview project identity verified without exposing environment values.');
          NODE

      - name: Build exact-head Vercel artifact outside Vercel cloud-build quota
        shell: bash
        run: |
          set -euo pipefail
          EL_MOLINO_RELEASE_SHA="$TARGET_SHA" vercel build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          test -d .vercel/output || { echo '::error::Vercel Build Output API artifact missing'; exit 1; }

      - name: Deploy immutable prebuilt artifact to Vercel Preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_URL="$(vercel deploy --prebuilt --archive=tgz --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --env "EL_MOLINO_RELEASE_SHA=$TARGET_SHA" --meta "release_sha=$TARGET_SHA" --meta "release_phase=1" --meta "build_method=github-actions-prebuilt" | tail -n 1 | tr -d '\r')"
          case "$PREVIEW_URL" in
            https://*.vercel.app) ;;
            *) echo "::error::Unexpected Vercel preview URL: $PREVIEW_URL"; exit 1;;
          esac
          echo "Exact-head prebuilt preview: $PREVIEW_URL"
          echo "$PREVIEW_URL" > phase1-vercel-preview-url.txt

      - name: Preserve exact-head preview pointer
        uses: actions/upload-artifact@v4
        with:
          name: phase1-vercel-prebuilt-preview
          path: phase1-vercel-preview-url.txt
          retention-days: 14
          if-no-files-found: error
