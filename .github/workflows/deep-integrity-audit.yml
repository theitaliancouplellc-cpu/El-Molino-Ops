name: One-time Deep Integrity Audit

on:
  push:
    branches: [deep-integrity-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate client/database mutation surfaces
        shell: bash
        run: |
          set -euo pipefail
          scan(){ grep -RInE --include='*.ts' --include='*.tsx' "$1" app lib || true; }
          echo '=== SUPABASE MUTATIONS ==='
          scan '\.(insert|update|upsert|delete)\('
          echo '=== CLIENT-GENERATED ISO TIMESTAMPS ==='
          scan 'new Date\([^)]*\)\.toISOString\(\)|new Date\(\)\.toISOString\(\)'
          echo '=== UTC DATE SLICING / DATE-ONLY RISKS ==='
          scan 'toISOString\(\).*(slice|substring)\(|split\(['"'"']T['"'"']\)'
          echo '=== EMPTY / SILENT CATCHES ==='
          scan 'catch[^\{]*\{[[:space:]]*\}'
          echo '=== DIRECT STATUS WRITES ==='
          scan 'status[[:space:]]*:[[:space:]]*['"'"']|\.update\(\{[^}]*status'
          echo '=== CLIENT AUDIT IDENTITY FIELDS ==='
          scan '(created_by|updated_by|verified_by|reviewed_by|finalized_by|completed_by|invited_by)[[:space:]]*:'
          echo '=== DIRECT LOCATION WRITES ==='
          scan 'location_id[[:space:]]*:'
          echo '=== RPC CALLS ==='
          scan '\.rpc\('
      - name: Run locked regression verification
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
