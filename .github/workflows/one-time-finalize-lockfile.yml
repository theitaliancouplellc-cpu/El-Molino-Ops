name: One-time finalize verified lockfile

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-finalize-lockfile.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit finalization branch
        uses: actions/checkout@v4
        with:
          ref: audit-finalize-20260814
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact artifact lockfile digest
        shell: bash
        run: |
          actual="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="6160765db1597f34d38d2e66e591a91492a94baea1deea4f99e76e421ccd708f"
          echo "lockfile sha256=$actual"
          test "$actual" = "$expected"
      - name: Install, test, typecheck, build
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm run build
      - name: Commit verified lockfile to audit branch
        shell: bash
        run: |
          git config user.name "El Molino Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Commit verified dependency lockfile"
          git push origin HEAD:audit-finalize-20260814
