name: Deploy El Molino Ops to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EL_MOLINO_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout certified source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run release gates
        run: |
          npx tsc --noEmit
          npm test

      - name: Build Cloudflare OpenNext worker
        run: npm run cf:build

      - name: Validate baked release identity before publish
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_RELEASE_SHA"
          if ! grep -R -F -q --exclude='*.map' "$EXPECTED_RELEASE_SHA" .open-next/server-functions .open-next/middleware 2>/dev/null; then
            echo "Built Cloudflare artifact does not contain expected release SHA: $EXPECTED_RELEASE_SHA" >&2
            exit 1
          fi
          echo "Built artifact contains expected release SHA: $EXPECTED_RELEASE_SHA"

      - name: Validate Cloudflare Free production limits
        id: limits
        run: |
          set -euo pipefail

          largest_asset="$(find .open-next/assets -type f -printf '%s\t%P\n' | sort -nr | head -n 1)"
          largest_asset_bytes="${largest_asset%%$'\t'*}"
          largest_asset_path="${largest_asset#*$'\t'}"
          max_asset_bytes=26214400

          echo "largest-asset-bytes=$largest_asset_bytes" >> "$GITHUB_OUTPUT"
          echo "largest-asset-path=$largest_asset_path" >> "$GITHUB_OUTPUT"
          echo "Largest static asset: $largest_asset_path ($largest_asset_bytes bytes)"

          if [ "$largest_asset_bytes" -gt "$max_asset_bytes" ]; then
            echo "Static asset exceeds Cloudflare Workers 25 MiB production limit."
            exit 1
          fi

          npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run 2>&1 | tee /tmp/wrangler-dry-run.log
          gzip_kib="$(sed -nE 's/.*gzip: ([0-9]+([.][0-9]+)?) KiB.*/\1/p' /tmp/wrangler-dry-run.log | tail -n 1)"
          test -n "$gzip_kib"
          echo "worker-gzip-kib=$gzip_kib" >> "$GITHUB_OUTPUT"

          node -e "const kib=Number(process.argv[1]); const freeLimit=3*1000*1000/1024; if(!Number.isFinite(kib)||kib>freeLimit){console.error('Worker exceeds Cloudflare Workers Free 3 MB gzip limit:',kib,'KiB');process.exit(1)} console.log('Worker gzip size:',kib,'KiB; Cloudflare Workers Free limit:',freeLimit.toFixed(2),'KiB')" "$gzip_kib"

      - name: Require authenticated Cloudflare production credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        env:
          WORKER_GZIP_KIB: ${{ steps.limits.outputs.worker-gzip-kib }}
          LARGEST_ASSET_PATH: ${{ steps.limits.outputs.largest-asset-path }}
          LARGEST_ASSET_BYTES: ${{ steps.limits.outputs.largest-asset-bytes }}
        run: |
          {
            echo '## Cloudflare production deployment BLOCKED'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`el-molino-ops\`"
            echo '- Release gates: PASS'
            echo '- OpenNext build: PASS'
            echo "- Worker gzip: ${WORKER_GZIP_KIB} KiB (Free limit: 3 MB)"
            echo "- Largest asset: \`${LARGEST_ASSET_PATH}\` (${LARGEST_ASSET_BYTES} bytes; limit: 25 MiB)"
            echo '- Production package limits: PASS'
            echo '- Publish: BLOCKED — GitHub Actions is missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID'
            echo '- This workflow fails closed so a skipped publish can never be reported as a successful production deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare production deployment credentials are missing. Failing closed.' >&2
          exit 1

      - name: Ensure account workers.dev subdomain exists
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          status="$(curl -sS -o /tmp/cf-workers-subdomain.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$api")"

          if [ "$status" = "200" ]; then
            existing="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-workers-subdomain.json','utf8'));process.stdout.write(j?.result?.subdomain||'')")"
            if [ -n "$existing" ]; then
              echo "Cloudflare account workers.dev subdomain already exists."
              exit 0
            fi
          elif [ "$status" != "404" ]; then
            echo "Unable to inspect Cloudflare workers.dev account subdomain (HTTP $status)." >&2
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-workers-subdomain.json','utf8'));console.error((j.errors||[]).map(e=>e.message).join('; ')||'Cloudflare API error')"
            exit 1
          fi

          suffix="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-10)"
          candidate="el-molino-ops-${suffix}"
          echo "No workers.dev account subdomain exists; creating a deterministic deployment subdomain."

          curl -fsS -X PUT "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"subdomain\":\"${candidate}\"}" \
            > /tmp/cf-workers-subdomain-create.json

          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-workers-subdomain-create.json','utf8'));if(!j.success||!j.result?.subdomain){console.error((j.errors||[]).map(e=>e.message).join('; ')||'Cloudflare subdomain creation failed');process.exit(1)} console.log('Cloudflare workers.dev account subdomain created successfully.')"

      - name: Deploy production Worker
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm

      - name: Smoke test deployed Worker
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          test -n "$EXPECTED_RELEASE_SHA"
          echo "Deployment URL: $DEPLOYMENT_URL"

          matched=false
          last_seen='unavailable'
          for i in {1..60}; do
            url="${DEPLOYMENT_URL}/api/health?release=${EXPECTED_RELEASE_SHA}&attempt=${i}"
            if curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$url" > /tmp/health.json; then
              last_seen="$(node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));process.stdout.write(String(h.release?.sha||'missing'))")"
              if EXPECTED_RELEASE_SHA="$EXPECTED_RELEASE_SHA" node -e "const h=require('/tmp/health.json');const expected=process.env.EXPECTED_RELEASE_SHA;if(!h.ok||!h.checks?.filter(c=>c.required).every(c=>c.ok)||h.release?.sha!==expected)process.exit(1)"; then
                matched=true
                break
              fi
            fi
            echo "Waiting for Cloudflare release propagation ($i/60); live release: $last_seen; expected: $EXPECTED_RELEASE_SHA"
            sleep 2
          done

          cat /tmp/health.json || true
          if [ "$matched" != true ]; then
            echo "Production release identity mismatch after propagation window: $last_seen expected $EXPECTED_RELEASE_SHA" >&2
            exit 1
          fi

          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "${DEPLOYMENT_URL}/?release=${EXPECTED_RELEASE_SHA}" | grep -q 'El Molino Ops'

      - name: Publish production deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          WORKER_GZIP_KIB: ${{ steps.limits.outputs.worker-gzip-kib }}
        run: |
          {
            echo '## Cloudflare production deployment'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`el-molino-ops\`"
            echo "- Worker gzip: ${WORKER_GZIP_KIB} KiB"
            echo "- URL: ${DEPLOYMENT_URL}"
            echo '- Release artifact identity: PASS'
            echo '- Release propagation identity: PASS'
            echo '- Health check: PASS'
            echo '- Production publish: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
