name: Deploy El Molino Ops to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Exact-main staging gate and production release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCTION_WORKER: el-molino-ops
      STAGING_WORKER: el-molino-ops-release-gate
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Require canonical main release event
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo '::error::Production Cloudflare release must run from main'; exit 1; }
          test "$STAGING_WORKER" != "$PRODUCTION_WORKER"
          test "${#TARGET_SHA}" -eq 40
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require merged-PR release provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-main-release-provenance.mjs

      - name: Prove immutable main source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build and test exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          EL_MOLINO_RELEASE_SHA="$TARGET_SHA" RELEASE_SHA="$TARGET_SHA" npm run cf:build
          if ! grep -R -F -q --exclude='*.map' "$TARGET_SHA" .open-next/server-functions .open-next/middleware 2>/dev/null; then
            echo "::error::Built Cloudflare artifact does not contain expected release SHA: $TARGET_SHA"
            exit 1
          fi

      - name: Enforce Cloudflare Free package limits
        shell: bash
        run: |
          set -euo pipefail
          largest_asset="$(find .open-next/assets -type f -printf '%s\t%P\n' | sort -nr | head -n 1)"
          largest_asset_bytes="${largest_asset%%$'\t'*}"
          largest_asset_path="${largest_asset#*$'\t'}"
          test "$largest_asset_bytes" -le 26214400 || { echo "::error::Static asset exceeds 25 MiB: $largest_asset_path"; exit 1; }

          npx wrangler deploy --env release_gate --name "$STAGING_WORKER" --dry-run --outdir /tmp/cloudflare-release-dry-run 2>&1 | tee /tmp/cloudflare-release-dry-run.log
          python3 - <<'PY'
          import re
          s=open('/tmp/cloudflare-release-dry-run.log').read()
          m=re.search(r'Total Upload:\s*[^/]+/\s*(?:gzip:\s*)?([0-9.]+)\s*(KiB|MiB)',s,re.I)
          if not m: raise SystemExit('compressed Worker size not found')
          n=float(m.group(1)); unit=m.group(2).lower(); b=int(n*(1024 if unit=='kib' else 1024*1024))
          open('/tmp/cf-compressed-bytes','w').write(str(b))
          print('compressed_worker_bytes='+str(b))
          if b>3_000_000: raise SystemExit('Worker exceeds Cloudflare Workers Free 3 MB compressed limit')
          PY
          printf '%s' "$largest_asset_path" > /tmp/cf-largest-asset-path
          printf '%s' "$largest_asset_bytes" > /tmp/cf-largest-asset-bytes

      - name: Require authenticated Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CLOUDFLARE_API_TOKEN unavailable'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID unavailable'; exit 1; }

      - name: Resolve or create account workers.dev subdomain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          status="$(curl -sS -o /tmp/cf-workers-subdomain.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"

          if [ "$status" = '200' ]; then
            existing="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf-workers-subdomain.json','utf8'));process.stdout.write(j?.result?.subdomain||'')")"
            if [ -n "$existing" ]; then
              printf '%s' "$existing" > /tmp/cf-subdomain
              exit 0
            fi
          elif [ "$status" != '404' ]; then
            echo "Unable to inspect Cloudflare workers.dev subdomain (HTTP $status)." >&2
            exit 1
          fi

          suffix="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-10)"
          candidate="el-molino-ops-${suffix}"
          curl -fsS -X PUT "$api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "{\"subdomain\":\"${candidate}\"}" > /tmp/cf-workers-subdomain-create.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/cf-workers-subdomain-create.json','utf8'));
          if(!j.success||!j.result?.subdomain) throw new Error((j.errors||[]).map(e=>e.message).join('; ')||'Cloudflare subdomain creation failed');
          fs.writeFileSync('/tmp/cf-subdomain',j.result.subdomain);
          NODE

      - name: Deploy exact main SHA to release-gate Worker
        shell: bash
        run: |
          set -euo pipefail
          EL_MOLINO_RELEASE_SHA="$TARGET_SHA" RELEASE_SHA="$TARGET_SHA" npx wrangler deploy --env release_gate --name "$STAGING_WORKER" --keep-vars 2>&1 | tee /tmp/cf-staging-deploy.log
          SUBDOMAIN="$(cat /tmp/cf-subdomain)"
          printf 'https://%s.%s.workers.dev' "$STAGING_WORKER" "$SUBDOMAIN" > /tmp/cf-staging-url

      - name: Gate production on exact-main staging health and root runtime
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/cf-staging-url)"
          CODE=''
          HEADER_SHA=''
          BODY_SHA=''
          IDENTITY_MATCHED=false
          for i in {1..60}; do
            CODE="$(curl -sS -D /tmp/staging-health.headers -o /tmp/staging-health.json -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL/api/health?release=$TARGET_SHA&attempt=$i" || true)"
            HEADER_SHA="$(awk -F': ' 'tolower($1)=="x-el-molino-release" {gsub("\r",""); print $2}' /tmp/staging-health.headers 2>/dev/null | tail -1)"
            BODY_SHA="$(node -e "try{const h=JSON.parse(require('fs').readFileSync('/tmp/staging-health.json','utf8'));process.stdout.write(h.release?.sha||'')}catch{}")"
            if [ "$CODE" = 200 ] && [ "$BODY_SHA" = "$TARGET_SHA" ] && [ "$HEADER_SHA" = "$TARGET_SHA" ]; then
              IDENTITY_MATCHED=true
              break
            fi
            echo "Staging release identity not propagated yet (attempt $i): status=${CODE:-none} body=${BODY_SHA:-none} header=${HEADER_SHA:-none}"
            sleep 2
          done
          test "$IDENTITY_MATCHED" = true || { echo '::error::Exact staging release identity did not propagate within the bounded verification window'; cat /tmp/staging-health.headers || true; cat /tmp/staging-health.json || true; exit 1; }
          node - <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/staging-health.json','utf8')); const expected=process.env.TARGET_SHA;
          if(!h.ok) throw new Error('staging health not ok');
          if(h.release?.sha!==expected) throw new Error(`staging release mismatch ${h.release?.sha}`);
          if(!h.checks?.filter(c=>c.required).every(c=>c.ok)) throw new Error('staging required health check failed');
          NODE
          test "$HEADER_SHA" = "$TARGET_SHA"
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL/?release=$TARGET_SHA" | grep -q 'El Molino Ops'

      - name: Capture exact-main staging runtime-tail evidence
        id: runtime_tail
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/cf-staging-url)"
          : > /tmp/cf-tail.json
          : > /tmp/cf-tail.err
          npx wrangler tail "$STAGING_WORKER" --format json --method GET > /tmp/cf-tail.json 2>/tmp/cf-tail.err &
          TAIL_PID=$!
          cleanup_tail() {
            kill -INT "$TAIL_PID" 2>/dev/null || true
            for i in {1..10}; do kill -0 "$TAIL_PID" 2>/dev/null || break; sleep 1; done
            kill -TERM "$TAIL_PID" 2>/dev/null || true
            wait "$TAIL_PID" 2>/dev/null || true
          }
          trap cleanup_tail EXIT
          sleep 10
          kill -0 "$TAIL_PID" 2>/dev/null || { echo '::error::Release-gate tail session exited before probes'; cat /tmp/cf-tail.err || true; exit 1; }

          successful_probes=0
          for i in {1..8}; do
            probe_ok=false
            for attempt in {1..10}; do
              CODE="$(curl -sS -D "/tmp/cf-tail-health-${i}.headers" -o "/tmp/cf-tail-health-${i}.json" -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL/api/health?audit=release-$i-$GITHUB_RUN_ID&release=$TARGET_SHA&attempt=$attempt" || true)"
              HEADER_SHA="$(awk -F': ' 'tolower($1)=="x-el-molino-release" {gsub("\r",""); print $2}' "/tmp/cf-tail-health-${i}.headers" 2>/dev/null | tail -1)"
              BODY_SHA="$(node -e "try{const h=JSON.parse(require('fs').readFileSync('/tmp/cf-tail-health-${i}.json','utf8'));process.stdout.write(h.release?.sha||'')}catch{}")"
              if [ "$CODE" = 200 ] && [ "$BODY_SHA" = "$TARGET_SHA" ] && [ "$HEADER_SHA" = "$TARGET_SHA" ]; then
                probe_ok=true
                successful_probes=$((successful_probes+1))
                break
              fi
              echo "Runtime-tail probe $i not ready (attempt $attempt): status=${CODE:-none} body=${BODY_SHA:-none} header=${HEADER_SHA:-none}"
              sleep 2
            done
            test "$probe_ok" = true || { echo "::error::Runtime-tail probe $i never reached exact release identity"; exit 1; }
            sleep 1
          done
          test "$successful_probes" -eq 8 || { echo "::error::Expected 8 exact-identity runtime-tail probes, saw $successful_probes"; exit 1; }

          sleep 10
          cleanup_tail
          trap - EXIT
          test ! -s /tmp/cf-tail.err || cat /tmp/cf-tail.err
          python3 - <<'PY'
          import json
          text=open('/tmp/cf-tail.json',errors='ignore').read(); decoder=json.JSONDecoder(); objects=[]; cursor=0
          while cursor < len(text):
            start=text.find('{',cursor)
            if start < 0: break
            try: obj,end=decoder.raw_decode(text,start)
            except json.JSONDecodeError: cursor=start+1; continue
            if isinstance(obj,dict): objects.append(obj)
            cursor=end
          seen=tagged=0; bad=[]
          for x in objects:
            if 'event' not in x and 'outcome' not in x: continue
            seen+=1; outcome=str(x.get('outcome','')).lower(); exc=x.get('exceptions') or []
            url=str((((x.get('event') or {}).get('request') or {}).get('url','')))
            if '/api/health?audit=release-' in url: tagged+=1
            if outcome and outcome not in ('ok','unknown'): bad.append(outcome)
            if exc: bad.append('exception')
          print(f'tail_events={seen} tagged_health_events={tagged} runtime_failures={len(bad)}')
          if seen < 1 or tagged < 1 or bad: raise SystemExit('staging runtime-tail gate failed')
          PY

      - name: Build sanitized runtime-tail diagnostics
        if: ${{ steps.runtime_tail.outcome != 'success' }}
        shell: bash
        env:
          RUNTIME_TAIL_OUTCOME: ${{ steps.runtime_tail.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, os, re
          from urllib.parse import parse_qs, urlparse

          target=os.environ.get('TARGET_SHA','')
          tail_path='/tmp/cf-tail.json'
          err_path='/tmp/cf-tail.err'
          text=open(tail_path,errors='ignore').read() if os.path.exists(tail_path) else ''
          err=open(err_path,errors='ignore').read() if os.path.exists(err_path) else ''
          decoder=json.JSONDecoder(); objects=[]; cursor=0
          while cursor < len(text):
            start=text.find('{',cursor)
            if start < 0: break
            try: obj,end=decoder.raw_decode(text,start)
            except json.JSONDecodeError: cursor=start+1; continue
            if isinstance(obj,dict): objects.append(obj)
            cursor=end

          runtime=[]; tagged=[]
          outcomes=collections.Counter(); tagged_outcomes=collections.Counter()
          exception_events=0; tagged_exception_events=0
          for x in objects:
            if 'event' not in x and 'outcome' not in x: continue
            runtime.append(x)
            outcome=str(x.get('outcome','')).lower() or 'missing'
            outcomes[outcome]+=1
            exc=x.get('exceptions') or []
            if exc: exception_events+=1
            url=str((((x.get('event') or {}).get('request') or {}).get('url','')))
            if '/api/health?audit=release-' not in url: continue
            parsed=urlparse(url); q=parse_qs(parsed.query)
            item={
              'path':parsed.path,
              'audit':(q.get('audit') or [None])[0],
              'attempt':(q.get('attempt') or [None])[0],
              'release_matches_target':(q.get('release') or [None])[0] == target,
              'outcome':outcome,
              'exception_count':len(exc),
            }
            tagged.append(item); tagged_outcomes[outcome]+=1
            if exc: tagged_exception_events+=1

          probe_files=[]
          for i in range(1,9):
            hp=f'/tmp/cf-tail-health-{i}.headers'; bp=f'/tmp/cf-tail-health-{i}.json'
            header_sha=''; body_sha=''; status=''
            if os.path.exists(hp):
              headers=open(hp,errors='ignore').read().splitlines()
              for line in headers:
                if line.lower().startswith('http/'):
                  parts=line.split(); status=parts[1] if len(parts)>1 else status
                if line.lower().startswith('x-el-molino-release:'):
                  header_sha=line.split(':',1)[1].strip()
            if os.path.exists(bp):
              try: body_sha=(json.load(open(bp)).get('release') or {}).get('sha','')
              except Exception: pass
            probe_files.append({
              'probe':i,
              'status':status or None,
              'header_matches_target':header_sha==target,
              'body_matches_target':body_sha==target,
            })

          def redact(line):
            line=re.sub(r'(?i)(authorization\s*:\s*bearer\s+)[^\s]+',r'\1[REDACTED]',line)
            line=re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+\-/=]+',r'\1[REDACTED]',line)
            line=re.sub(r'(?i)((?:api[_ -]?token|secret|password|api[_ -]?key)\s*[=:]\s*)[^\s]+',r'\1[REDACTED]',line)
            return line[:1000]
          err_lines=err.splitlines()
          excerpt=[redact(x) for x in (err_lines[:20]+(err_lines[-20:] if len(err_lines)>20 else []))]

          payload={
            'target_sha':target,
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'release_gate_worker':os.environ.get('STAGING_WORKER'),
            'runtime_tail_outcome':os.environ.get('RUNTIME_TAIL_OUTCOME'),
            'tail_json_bytes':len(text.encode()),
            'tail_stderr_bytes':len(err.encode()),
            'tail_stderr_lines':len(err_lines),
            'tail_stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),
            'tail_stderr_excerpt_redacted':excerpt,
            'decoded_json_objects':len(objects),
            'runtime_event_count':len(runtime),
            'tagged_audit_event_count':len(tagged),
            'outcomes':dict(outcomes),
            'tagged_outcomes':dict(tagged_outcomes),
            'exception_event_count':exception_events,
            'tagged_exception_event_count':tagged_exception_events,
            'tagged_events':tagged[:100],
            'final_probe_files':probe_files,
          }
          with open('/tmp/cloudflare-release-tail-diagnostics.json','w') as f:
            json.dump(payload,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Preserve sanitized runtime-tail diagnostics
        if: ${{ steps.runtime_tail.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-release-tail-diagnostics-${{ env.TARGET_SHA }}
          path: /tmp/cloudflare-release-tail-diagnostics.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce runtime-tail evidence gate
        if: ${{ always() }}
        shell: bash
        env:
          RUNTIME_TAIL_OUTCOME: ${{ steps.runtime_tail.outcome }}
        run: |
          set -euo pipefail
          test "$RUNTIME_TAIL_OUTCOME" = 'success' || {
            echo '::error::Release-gate runtime-tail evidence failed; production remains blocked'
            exit 1
          }

      - name: Deploy already-built exact SHA to production Worker
        shell: bash
        run: |
          set -euo pipefail
          EL_MOLINO_RELEASE_SHA="$TARGET_SHA" RELEASE_SHA="$TARGET_SHA" npx wrangler deploy --name "$PRODUCTION_WORKER" --keep-vars 2>&1 | tee /tmp/cf-production-deploy.log
          SUBDOMAIN="$(cat /tmp/cf-subdomain)"
          printf 'https://%s.%s.workers.dev' "$PRODUCTION_WORKER" "$SUBDOMAIN" > /tmp/cf-production-url

      - name: Verify exact production release identity
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/cf-production-url)"
          CODE=''
          HEADER_SHA=''
          BODY_SHA=''
          IDENTITY_MATCHED=false
          for i in {1..60}; do
            CODE="$(curl -sS -D /tmp/production-health.headers -o /tmp/production-health.json -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL/api/health?release=$TARGET_SHA&attempt=$i" || true)"
            HEADER_SHA="$(awk -F': ' 'tolower($1)=="x-el-molino-release" {gsub("\r",""); print $2}' /tmp/production-health.headers 2>/dev/null | tail -1)"
            BODY_SHA="$(node -e "try{const h=JSON.parse(require('fs').readFileSync('/tmp/production-health.json','utf8'));process.stdout.write(h.release?.sha||'')}catch{}")"
            if [ "$CODE" = 200 ] && [ "$BODY_SHA" = "$TARGET_SHA" ] && [ "$HEADER_SHA" = "$TARGET_SHA" ]; then
              IDENTITY_MATCHED=true
              break
            fi
            echo "Production release identity not propagated yet (attempt $i): status=${CODE:-none} body=${BODY_SHA:-none} header=${HEADER_SHA:-none}"
            sleep 2
          done
          test "$IDENTITY_MATCHED" = true || { echo '::error::Exact production release identity did not propagate within the bounded verification window'; cat /tmp/production-health.headers || true; cat /tmp/production-health.json || true; exit 1; }
          node - <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/production-health.json','utf8')); const expected=process.env.TARGET_SHA;
          if(!h.ok) throw new Error('production health not ok');
          if(h.release?.sha!==expected) throw new Error(`production release mismatch ${h.release?.sha}`);
          if(!h.checks?.filter(c=>c.required).every(c=>c.ok)) throw new Error('production required health check failed');
          NODE
          test "$HEADER_SHA" = "$TARGET_SHA"
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL/?release=$TARGET_SHA" | grep -q 'El Molino Ops'

      - name: Record final staging and production version identities
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name "$STAGING_WORKER" --json > /tmp/cf-staging-status.json
          npx wrangler deployments status --name "$PRODUCTION_WORKER" --json > /tmp/cf-production-status.json
          cat /tmp/cf-production-status.json

      - name: Publish canonical Cloudflare release summary
        shell: bash
        run: |
          {
            echo '## Canonical Cloudflare release — PASS'
            echo
            echo "- Exact main SHA: \`${TARGET_SHA}\`"
            echo "- Release-gate Worker: \`${STAGING_WORKER}\`"
            echo "- Release-gate URL: $(cat /tmp/cf-staging-url)"
            echo "- Production Worker: \`${PRODUCTION_WORKER}\`"
            echo "- Production URL: $(cat /tmp/cf-production-url)"
            echo "- Worker compressed bytes: $(cat /tmp/cf-compressed-bytes)"
            echo "- Largest asset: \`$(cat /tmp/cf-largest-asset-path)\` ($(cat /tmp/cf-largest-asset-bytes) bytes)"
            echo '- Exact-main build and regression suite: PASS'
            echo '- Exact-main release-gate health/root/runtime-tail: PASS'
            echo '- Production publish: PASS'
            echo '- Exact production release identity and required health: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
