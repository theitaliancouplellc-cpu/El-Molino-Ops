name: Deploy El Molino Ops to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout certified source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run release gates
        run: |
          npx tsc --noEmit
          npm test

      - name: Build Cloudflare OpenNext worker
        run: npm run cf:build

      - name: Deploy production Worker
        id: cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm

      - name: Prepare temporary verification assets
        id: temp_assets
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          find .open-next/assets -type f -size +5242880c -printf '%P\t%s\n' | sort > /tmp/temporary-omissions.tsv
          omitted_count="$(wc -l < /tmp/temporary-omissions.tsv | tr -d ' ')"
          echo "omitted-count=$omitted_count" >> "$GITHUB_OUTPUT"

          if [ "$omitted_count" -gt 0 ]; then
            echo 'Temporary Cloudflare accounts cap static assets at 5 MiB; omitting these production-valid assets from the verification-only deployment:'
            cat /tmp/temporary-omissions.tsv
            while IFS=$'\t' read -r relative_path size; do
              test -n "$relative_path"
              rm -f ".open-next/assets/$relative_path"
            done < /tmp/temporary-omissions.tsv
          else
            echo 'No temporary-only static asset omissions required.'
          fi

      - name: Deploy temporary Worker
        id: temporary
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          NO_COLOR: '1'
        run: |
          set +e
          npx wrangler deploy --temporary > /tmp/cloudflare-deploy.log 2>&1
          status=$?
          set -e

          claim_url="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' /tmp/cloudflare-deploy.log | tail -n 1 || true)"
          if [ -n "$claim_url" ]; then
            echo "::add-mask::$claim_url"
          fi

          if [ "$status" -ne 0 ]; then
            sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<claim-url-redacted>#g' /tmp/cloudflare-deploy.log | tail -n 120
            rm -f /tmp/cloudflare-deploy.log
            exit "$status"
          fi

          deployment_url="$(grep -Eo 'https://[-A-Za-z0-9.]+\.workers\.dev' /tmp/cloudflare-deploy.log | tail -n 1 || true)"
          test -n "$deployment_url"
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo 'Temporary Cloudflare Worker deployed for live verification.'
          rm -f /tmp/cloudflare-deploy.log

      - name: Resolve deployment target
        env:
          PROD_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          TEMP_URL: ${{ steps.temporary.outputs.deployment-url }}
          PROD_OUTCOME: ${{ steps.cloudflare.outcome }}
        run: |
          if [ "$PROD_OUTCOME" = 'success' ] && [ -n "$PROD_URL" ]; then
            echo "DEPLOYMENT_URL=$PROD_URL" >> "$GITHUB_ENV"
            echo 'DEPLOYMENT_MODE=production' >> "$GITHUB_ENV"
          else
            test -n "$TEMP_URL"
            echo "DEPLOYMENT_URL=$TEMP_URL" >> "$GITHUB_ENV"
            echo 'DEPLOYMENT_MODE=temporary verification' >> "$GITHUB_ENV"
          fi

      - name: Smoke test deployed Worker
        run: |
          test -n "$DEPLOYMENT_URL"
          echo "Deployment URL: $DEPLOYMENT_URL"
          for i in {1..30}; do
            if curl -fsS "$DEPLOYMENT_URL/api/health" > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok || !h.checks?.filter(c=>c.required).every(c=>c.ok)) process.exit(1)"
          curl -fsS "$DEPLOYMENT_URL/" | grep -q 'El Molino Ops'

      - name: Publish deployment summary
        env:
          TEMP_OMITTED: ${{ steps.temp_assets.outputs.omitted-count }}
        run: |
          {
            echo '## Cloudflare deployment'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`el-molino-ops\`"
            echo "- Mode: ${DEPLOYMENT_MODE}"
            echo "- URL: ${DEPLOYMENT_URL}"
            if [ "$DEPLOYMENT_MODE" = 'temporary verification' ]; then
              echo "- Temporary-only oversized assets omitted: ${TEMP_OMITTED:-0}"
            fi
            echo '- Health check: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
