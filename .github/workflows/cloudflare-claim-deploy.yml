name: One-time Cloudflare Claim Deploy

on:
  push:
    branches: [cloudflare-claim-deploy]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare worker
        run: npm run cf:build
      - name: Exclude remotely loaded ONNX runtime binary
        run: |
          find .open-next/assets -type f -name 'ort-wasm-*.wasm' -print -delete
          oversized=$(find .open-next/assets -type f -size +5M -print)
          if [ -n "$oversized" ]; then
            echo "Cloudflare temporary deployment still contains oversized assets:" >&2
            echo "$oversized" >&2
            exit 1
          fi
      - name: Deploy to temporary Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --temporary \
            --var NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL} \
            --var NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY} \
            2>&1 | tee /tmp/cloudflare-claim.log
      - name: Print claim information
        if: always()
        run: cat /tmp/cloudflare-claim.log || true
