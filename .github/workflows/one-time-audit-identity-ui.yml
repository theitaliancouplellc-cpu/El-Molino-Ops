name: One-time Audit Identity UI Cleanup

on:
  push:
    branches: [audit-identity-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-identity-ui
      - name: Remove browser-owned audit identities
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'app/calendar/page.tsx': [
              (',created_by:u.user.id});setBusy(false)', '});setBusy(false)'),
            ],
            'app/import/page.tsx': [
              (".insert({location_id:profile.location_id,created_by:u.user.id,import_type:type", ".insert({location_id:profile.location_id,import_type:type"),
            ],
            'app/tasks/page.tsx': [
              (",recurrence_rule:rr||null,created_by:u.user.id}).select('id')", ",recurrence_rule:rr||null}).select('id')"),
            ],
            'app/safety/page.tsx': [
              ("try{const {data:u}=await supabase.auth.getUser();const {error}=await supabase.from('food_safety_temperature_points').insert({location_id:profile.location_id,label:pointForm.label.trim().slice(0,200),min_f:min,max_f:max,created_by:u.user?.id||null,updated_by:u.user?.id||null});", "try{const {error}=await supabase.from('food_safety_temperature_points').insert({location_id:profile.location_id,label:pointForm.label.trim().slice(0,200),min_f:min,max_f:max});"),
              ("try{const {data:u}=await supabase.auth.getUser();if(!u.user)return;const data=", "try{const data="),
              (",occurred_at:new Date().toISOString(),created_by:u.user.id,updated_by:u.user.id});", ",occurred_at:new Date().toISOString()});"),
            ],
            'app/performance/page.tsx': [
              ("try{const {data:u}=await supabase.auth.getUser();if(!u.user)return;const payload=", "try{const payload="),
              (",notes:form.notes.trim().slice(0,4000)||null,created_by:u.user.id,updated_by:u.user.id};", ",notes:form.notes.trim().slice(0,4000)||null};"),
              ("const payload=pending.map(r=>({location_id:profile.location_id,source:'toast_csv',created_by:u.user.id,updated_by:u.user.id,...r}));", "const payload=pending.map(r=>({location_id:profile.location_id,source:'toast_csv',...r}));"),
            ],
          }

          for file, reps in replacements.items():
            p=Path(file); s=p.read_text()
            for old,new in reps:
              count=s.count(old)
              if count != 1:
                raise SystemExit(f'{file}: expected exactly one match, got {count}: {old[:100]}')
              s=s.replace(old,new,1)
            p.write_text(s)

          test=Path('tests/audit-identity-ui-contract.test.ts')
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\n\nconst files=['app/calendar/page.tsx','app/import/page.tsx','app/tasks/page.tsx','app/safety/page.tsx','app/performance/page.tsx'];\nconst sources=Object.fromEntries(files.map(f=>[f,readFileSync(f,'utf8')]));\n\ntest('browser direct-write surfaces do not supply creator/updater audit identities',()=>{\n  for(const [file,source] of Object.entries(sources)){\n    assert.doesNotMatch(source,/created_by\\s*:\\s*u\\.user/,file);\n    assert.doesNotMatch(source,/updated_by\\s*:\\s*u\\.user/,file);\n  }\n});\n\ntest('direct-write features remain wired after audit cleanup',()=>{\n  assert.match(sources['app/calendar/page.tsx'],/from\\('calendar_events'\\)\\.insert/);\n  assert.match(sources['app/import/page.tsx'],/from\\('import_jobs'\\)\\.insert/);\n  assert.match(sources['app/tasks/page.tsx'],/from\\('tasks'\\)\\.insert/);\n  assert.match(sources['app/safety/page.tsx'],/from\\('food_safety_temperature_points'\\)\\.insert/);\n  assert.match(sources['app/performance/page.tsx'],/from\\('restaurant_daily_performance'\\)\\.upsert/);\n});\n""")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression suite
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified cleanup
        run: |
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add app/calendar/page.tsx app/import/page.tsx app/tasks/page.tsx app/safety/page.tsx app/performance/page.tsx tests/audit-identity-ui-contract.test.ts
          git commit -m "Move audit identity authority to the server"
          git push origin audit-identity-ui
