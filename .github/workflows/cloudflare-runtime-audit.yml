name: Cloudflare Runtime Replacement Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-runtime-audit
  cancel-in-progress: false

jobs:
  staging-proof:
    if: github.event.pull_request.head.ref == 'infra/cloudflare-runtime-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: e03ed65b5af4174c8430df9c9e761c21d9bac705
      STAGING_WORKER: el-molino-ops-phase1-staging
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate isolated target and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_WORKER" != 'el-molino-ops'
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CLOUDFLARE_API_TOKEN unavailable'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID unavailable'; exit 1; }
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > /tmp/cf-subdomain.json
          node -e "const x=require('/tmp/cf-subdomain.json'); if(!x.success||!x.result?.subdomain) process.exit(1); require('fs').writeFileSync('/tmp/cf-subdomain',x.result.subdomain)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Prove immutable PR source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build exact SHA and measure Worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          EL_MOLINO_RELEASE_SHA="$TARGET_SHA" RELEASE_SHA="$TARGET_SHA" npm run cf:build
          if ! grep -R -F -q --exclude='*.map' "$TARGET_SHA" .open-next/server-functions .open-next/middleware 2>/dev/null; then
            echo "::error::Built OpenNext artifact does not contain expected release SHA: $TARGET_SHA"
            exit 1
          fi
          npx wrangler deploy --name "$STAGING_WORKER" --dry-run --outdir /tmp/cf-audit-bundle 2>&1 | tee /tmp/cf-dry-run.log
          python3 - <<'PY'
          import re
          s=open('/tmp/cf-dry-run.log').read()
          m=re.search(r'Total Upload:\s*[^/]+/\s*(?:gzip:\s*)?([0-9.]+)\s*(KiB|MiB)',s,re.I)
          if not m: raise SystemExit('compressed Worker size not found')
          n=float(m.group(1)); unit=m.group(2).lower(); b=int(n*(1024 if unit=='kib' else 1024*1024))
          open('/tmp/cf-compressed-bytes','w').write(str(b))
          print('compressed_worker_bytes='+str(b))
          if b>10*1024*1024: raise SystemExit('Worker exceeds Workers Paid 10 MiB limit')
          PY

      - name: Record pre-audit staging deployment state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name "$STAGING_WORKER" --json > /tmp/cf-status-before.json || true
          cat /tmp/cf-status-before.json || true

      - name: Deploy exact SHA to disposable Cloudflare staging Worker
        shell: bash
        run: |
          set -euo pipefail
          EL_MOLINO_RELEASE_SHA="$TARGET_SHA" RELEASE_SHA="$TARGET_SHA" npx wrangler deploy --name "$STAGING_WORKER" --keep-vars 2>&1 | tee /tmp/cf-deploy.log
          SUBDOMAIN="$(cat /tmp/cf-subdomain)"
          URL="https://${STAGING_WORKER}.${SUBDOMAIN}.workers.dev"
          echo "$URL" > /tmp/cf-staging-url
          printf 'staging_url=%s\n' "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed health and exact release identity with one GET
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/cf-staging-url)"
          CODE=""
          for i in {1..60}; do
            CODE="$(curl -sS -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' "$URL/api/health?release=$TARGET_SHA" || true)"
            if [ "$CODE" = 200 ]; then break; fi
            sleep 2
          done
          test "$CODE" = 200 || { cat /tmp/health.headers || true; cat /tmp/health.json || true; exit 1; }
          HEADER_SHA="$(awk -F': ' 'tolower($1)=="x-el-molino-release" {gsub("\r",""); print $2}' /tmp/health.headers | tail -1)"
          node - <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); const expected=process.env.TARGET_SHA;
          if(!h.ok) throw new Error('health not ok');
          if(h.release?.sha!==expected) throw new Error(`release SHA mismatch ${h.release?.sha}`);
          if(!h.checks?.filter(c=>c.required).every(c=>c.ok)) throw new Error('required health check failed');
          NODE
          test "$HEADER_SHA" = "$TARGET_SHA"
          printf 'health_get_status=%s\nhealth_body_sha=%s\nhealth_header_sha=%s\n' "$CODE" "$TARGET_SHA" "$HEADER_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployed version identity before runtime proof
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name "$STAGING_WORKER" --json > /tmp/cf-status-deployed.json
          cat /tmp/cf-status-deployed.json

      - name: Capture runtime invocation/error evidence
        id: runtime_tail
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/cf-staging-url)"
          : > /tmp/cf-tail.jsonl
          : > /tmp/cf-tail.err

          # Cloudflare documents wrangler tail as the CLI for real-time Worker invocation,
          # console, error and exception logs. Explicit 100% sampling and GET filtering make
          # this certification probe deterministic while keeping traffic narrow.
          npx wrangler tail "$STAGING_WORKER" --format json --sampling-rate 1 --method GET > /tmp/cf-tail.jsonl 2>/tmp/cf-tail.err &
          TAIL_PID=$!

          cleanup_tail() {
            kill -INT "$TAIL_PID" 2>/dev/null || true
            for i in {1..10}; do
              kill -0 "$TAIL_PID" 2>/dev/null || break
              sleep 1
            done
            kill -TERM "$TAIL_PID" 2>/dev/null || true
            wait "$TAIL_PID" 2>/dev/null || true
          }
          trap cleanup_tail EXIT

          # Give Wrangler enough time to create and connect the tail session, then generate
          # multiple uniquely tagged invocations instead of racing a single request.
          sleep 10
          for i in {1..12}; do
            curl -fsS "$URL/api/health?audit=tail-$i-$GITHUB_RUN_ID" >/dev/null
            sleep 1
          done
          curl -fsS "$URL/" >/dev/null
          sleep 12

          cleanup_tail
          trap - EXIT

          echo '--- wrangler tail stderr ---'
          cat /tmp/cf-tail.err || true
          echo '--- wrangler tail stdout (first 80 lines) ---'
          sed -n '1,80p' /tmp/cf-tail.jsonl || true

          python3 - <<'PY'
          import json
          bad=[]; seen=0; health_seen=0
          for line in open('/tmp/cf-tail.jsonl',errors='ignore'):
            line=line.strip()
            if not line.startswith('{'): continue
            try: x=json.loads(line)
            except: continue
            seen+=1
            outcome=str(x.get('outcome','')).lower()
            exc=x.get('exceptions') or []
            event=x.get('event') or {}
            request=event.get('request') or {}
            url=str(request.get('url',''))
            if '/api/health?audit=tail-' in url: health_seen+=1
            if outcome and outcome not in ('ok','unknown'): bad.append(('outcome',outcome,url))
            if exc: bad.append(('exceptions',exc,url))
          print('tail_events='+str(seen))
          print('tagged_health_events='+str(health_seen))
          print('runtime_failures='+str(len(bad)))
          if seen < 1: raise SystemExit('no runtime tail events captured')
          if health_seen < 1: raise SystemExit('tail connected but no tagged health invocation was captured')
          if bad: print(bad[:10]); raise SystemExit(1)
          PY
          touch /tmp/cf-tail-pass

      - name: Exercise staging rollback and restore exact SHA
        id: rollback_drill
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/cf-staging-url)"
          RESTORED=0

          restore_exact() {
            echo 'Restoring exact target SHA to staging Worker...'
            EL_MOLINO_RELEASE_SHA="$TARGET_SHA" RELEASE_SHA="$TARGET_SHA" npx wrangler deploy --name "$STAGING_WORKER" --keep-vars 2>&1 | tee /tmp/cf-restore.log
            RESTORED=1
          }

          emergency_restore() {
            if [ "$RESTORED" != 1 ]; then
              echo 'Rollback drill exited before normal restore; performing emergency exact-SHA restore.' >&2
              restore_exact || true
            fi
          }
          trap emergency_restore EXIT

          npx wrangler rollback --name "$STAGING_WORKER" --message "El Molino Cloudflare audit rollback exercise" 2>&1 | tee /tmp/cf-rollback.log

          ROLLBACK_CODE=""
          for i in {1..60}; do
            ROLLBACK_CODE="$(curl -sS -D /tmp/rollback-health.headers -o /tmp/rollback-health.json -w '%{http_code}' "$URL/api/health?audit=rollback" || true)"
            if [ "$ROLLBACK_CODE" = 200 ]; then break; fi
            sleep 2
          done
          test "$ROLLBACK_CODE" = 200 || { cat /tmp/rollback-health.headers || true; cat /tmp/rollback-health.json || true; exit 1; }
          ROLLBACK_HEADER_SHA="$(awk -F': ' 'tolower($1)=="x-el-molino-release" {gsub("\r",""); print $2}' /tmp/rollback-health.headers | tail -1)"
          printf 'rollback_http_status=%s\nrollback_release_header=%s\n' "$ROLLBACK_CODE" "$ROLLBACK_HEADER_SHA" >> "$GITHUB_STEP_SUMMARY"

          restore_exact
          trap - EXIT

          RESTORE_CODE=""
          for i in {1..60}; do
            RESTORE_CODE="$(curl -sS -D /tmp/restore-health.headers -o /tmp/restore-health.json -w '%{http_code}' "$URL/api/health?release=$TARGET_SHA&audit=restore" || true)"
            if [ "$RESTORE_CODE" = 200 ]; then break; fi
            sleep 2
          done
          test "$RESTORE_CODE" = 200 || { cat /tmp/restore-health.headers || true; cat /tmp/restore-health.json || true; exit 1; }
          RESTORE_HEADER_SHA="$(awk -F': ' 'tolower($1)=="x-el-molino-release" {gsub("\r",""); print $2}' /tmp/restore-health.headers | tail -1)"
          node - <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/restore-health.json','utf8')); const expected=process.env.TARGET_SHA;
          if(!h.ok) throw new Error('restored health not ok');
          if(h.release?.sha!==expected) throw new Error(`restored release SHA mismatch ${h.release?.sha}`);
          if(!h.checks?.filter(c=>c.required).every(c=>c.ok)) throw new Error('restored required health check failed');
          NODE
          test "$RESTORE_HEADER_SHA" = "$TARGET_SHA"
          printf 'restore_http_status=%s\nrestore_header_sha=%s\n' "$RESTORE_CODE" "$RESTORE_HEADER_SHA" >> "$GITHUB_STEP_SUMMARY"
          touch /tmp/cf-rollback-pass

      - name: Record final deployment/version identity
        if: always()
        shell: bash
        run: |
          set -u
          npx wrangler deployments status --name "$STAGING_WORKER" --json 2>&1 | tee /tmp/cf-status-final.json || true
          {
            echo "target_sha=$TARGET_SHA"
            echo "staging_worker=$STAGING_WORKER"
            test -f /tmp/cf-staging-url && echo "staging_url=$(cat /tmp/cf-staging-url)"
            test -f /tmp/cf-compressed-bytes && echo "compressed_worker_bytes=$(cat /tmp/cf-compressed-bytes)"
            echo "runtime_tail_step=${{ steps.runtime_tail.outcome }}"
            echo "rollback_drill_step=${{ steps.rollback_drill.outcome }}"
            echo 'data_scope=production Supabase public configuration; only non-mutating health/root probes executed'
            echo 'rollback_scope=disposable staging Worker only; exact target SHA is restored after the rollback attempt'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Cloudflare staging certification gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/cf-tail-pass || { echo '::error::Runtime tail evidence gate did not pass'; exit 1; }
          test -f /tmp/cf-rollback-pass || { echo '::error::Rollback-and-restore evidence gate did not pass'; exit 1; }
          echo 'Cloudflare staging runtime-tail and rollback/restore gates passed.'
