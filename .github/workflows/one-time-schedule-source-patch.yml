name: One-time Schedule Source Patch

on:
  push:
    branches: [scheduling-v2-engine]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-v2-engine
      - name: Apply exact source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          changed=[]

          p=Path('app/schedule/optimizer/page.tsx')
          s=p.read_text()
          old="await load(pr.location_id,ws);setReady(true)"
          new="await load(pr.location_id!,ws);setReady(true)"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
              changed.append(str(p))

          replacements={
            'lib/scheduling-engine.ts':("new Set(['scheduled','covered','callout'])","new Set(['scheduled','covered'])"),
            'app/schedule/page.tsx':("['scheduled','covered','callout'].includes(s)","['scheduled','covered'].includes(s)"),
          }
          for name,(before,after) in replacements.items():
              p=Path(name); s=p.read_text()
              if before in s:
                  s=s.replace(before,after)
                  p.write_text(s)
                  changed.append(name)
          print('patched:', ', '.join(changed) if changed else 'already applied')
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add app/schedule/optimizer/page.tsx app/schedule/page.tsx lib/scheduling-engine.ts
          git commit -m "Do not count callouts as working coverage [schedule-source-patched]"
          git push origin HEAD:scheduling-v2-engine
