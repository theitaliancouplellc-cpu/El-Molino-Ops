name: One-time Shift Pool UI Patch

on:
  push:
    branches: [scheduling-7shifts-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://asuvgjxdmxizbnjrccsz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gtR8VfsQ5n-FPPbypnYKTw_f2k3Xyrk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scheduling-7shifts-parity
      - name: Wire Shift Pool into Schedule
        run: |
          python - <<'PY'
          from pathlib import Path

          pool=Path('app/schedule/pool/page.tsx')
          ps=pool.read_text()
          ps=ps.replace("async function act(fn:()=>Promise<{error:any}>|Promise<any>,ok:string)","async function act(fn:()=>any,ok:string)")
          pool.write_text(ps)

          p=Path('app/schedule/page.tsx')
          s=p.read_text()
          marker="  async function submitSwap(){"
          fn="""  async function offerShiftToPool(s:Shift){if(!me||s.employee_id!==me.id||busy||period?.status!=='published')return;const comment=prompt('Optional note for coworkers about this shift:')||'';if(!confirm('Put this shift up for grabs? You remain responsible for it until another employee is approved and the shift is reassigned.'))return;setBusy(true);const {error}=await supabase.rpc('offer_my_shift_to_pool',{p_shift_id:s.id,p_comment:comment.trim().slice(0,2000)||null,p_recipient_employee_ids:null,p_offered_starts_at:null,p_offered_ends_at:null});if(error){setMessage(error.message.includes('already up for grabs')?'This shift is already up for grabs. Open Shift Pool to view its bids.':'Could not put this shift up for grabs.')}else{setMessage('Shift is up for grabs. You are still responsible until a replacement is approved.');location.href='/schedule/pool'}setBusy(false)}\n\n"""
          if 'async function offerShiftToPool' not in s:
              s=s.replace(marker,fn+marker,1)

          old='<div className={styles.top}><div><h1>Schedule</h1><p>Coverage-driven scheduling, availability, time off, open shifts and labor control.</p></div><Link className={styles.back} href="/">Back to Ops</Link></div>'
          new='<div className={styles.top}><div><h1>Schedule</h1><p>Coverage-driven scheduling, availability, time off, open shifts and labor control.</p></div><div className={styles.actions} style={{marginTop:0}}><Link className={`${styles.button} ${styles.secondary}`} href="/schedule/pool">Shift Pool</Link><Link className={styles.back} href="/">Back to Ops</Link></div></div>'
          if old in s:
              s=s.replace(old,new,1)

          old_actions="{me&&s.employee_id===me.id&&period?.status==='published'&&!changes.some(c=>c.shift_id===s.id&&c.status==='pending')&&<div className={styles.actions}><button className={`${styles.button} ${styles.secondary}`} disabled={busy} onClick={()=>requestCoverage(s)}>Request Coverage</button><button className={`${styles.button} ${styles.secondary}`} disabled={busy} onClick={()=>{setSwapSource(s.id);setSwapTarget('')}}>Request Swap</button></div>}"
          new_actions="{me&&s.employee_id===me.id&&period?.status==='published'&&!changes.some(c=>c.shift_id===s.id&&c.status==='pending')&&<div className={styles.actions}><button className={styles.button} disabled={busy} onClick={()=>offerShiftToPool(s)}>Offer Up</button><button className={`${styles.button} ${styles.secondary}`} disabled={busy} onClick={()=>requestCoverage(s)}>Manager Coverage</button><button className={`${styles.button} ${styles.secondary}`} disabled={busy} onClick={()=>{setSwapSource(s.id);setSwapTarget('')}}>Trade Shift</button></div>}"
          if old_actions not in s:
              raise SystemExit('employee shift action contract not found')
          s=s.replace(old_actions,new_actions,1)
          p.write_text(s)

          t=Path('tests/scheduling-shift-pool-contract.test.ts')
          t.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\n\nconst schedule=readFileSync('app/schedule/page.tsx','utf8');\nconst pool=readFileSync('app/schedule/pool/page.tsx','utf8');\n\ntest('published employee shifts can be offered up without abandoning responsibility',()=>{\n  assert.match(schedule,/offer_my_shift_to_pool/);\n  assert.match(schedule,/You remain responsible for it until another employee is approved/);\n  assert.match(schedule,/>Offer Up</);\n  assert.match(schedule,/href=\\\"\\/schedule\\/pool\\\"/);\n});\n\ntest('Shift Pool exposes grabs requests mine and trades',()=>{\n  assert.match(pool,/Up for Grabs/);\n  assert.match(pool,/Requests/);\n  assert.match(pool,/Mine/);\n  assert.match(pool,/Trades/);\n  assert.match(pool,/bid_on_shift_pool_offer/);\n  assert.match(pool,/review_shift_pool_bid/);\n  assert.match(pool,/shift_pool_candidate_warnings/);\n});\n""")
          PY
      - name: Verify full scheduling surface
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm run build
          npm run cf:build
          npx wrangler deploy --dry-run
      - name: Commit verified patch
        run: |
          git config user.name "El Molino Ops CI"
          git config user.email "theitaliancouplellc@gmail.com"
          git add app/schedule/page.tsx app/schedule/pool/page.tsx tests/scheduling-shift-pool-contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire Shift Pool offer-up workflow into Schedule"
          git push origin HEAD:scheduling-7shifts-parity
